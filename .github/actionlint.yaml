# actionlint 1.7.12 does not know job.workflow_repository and job.workflow_sha; the entries go
# once a release of actionlint knows them
paths:
  .github/workflows/check-updates.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/validate.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
