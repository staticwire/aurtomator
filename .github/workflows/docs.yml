name: Documentation site

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "VERSION", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["site/**", "assets/**", "VERSION", ".github/workflows/docs.yml"]
  workflow_dispatch:

# Pushes to a pull request cancel its older runs, and every other run has a group of its own
concurrency:
  group: docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # withastro/action runs npm install, which goes on when package-lock.json lags package.json,
      # and npm ci stops there without installing anything in a dry run
      - name: Check the lock file
        working-directory: site
        run: npm ci --dry-run --ignore-scripts
      - name: Build the site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: ./site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # deploys the site to GitHub Pages
      id-token: write # deploy-pages verifies the source of the deployment with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
