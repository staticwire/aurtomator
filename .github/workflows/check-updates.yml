name: Check AUR Package Updates

# The calling repository is checked out at the workspace root and holds
# the data. aurtomator is checked out at job.workflow_sha into aurtomator/
# and holds the code. The image job checks out only the Dockerfile of
# aurtomator, and the issues job only aurtomator.
on:
  workflow_call:
    secrets:
      AUR_SSH_KEY:
        required: false
      GPG_SIGNING_KEY:
        required: false
      AUR_GIT_NAME:
        required: false
      AUR_GIT_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from .github/ci-image/Dockerfile, where
  # Dependabot updates its digest
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      # With an empty ref, actions/checkout takes the default branch of a
      # repository other than the one that triggered the run. The run would
      # then use the code of main, and no step would fail.
      - name: Check the pin
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA: '$SHA'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' .github/ci-image/Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::.github/ci-image/Dockerfile must pin archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  # Runs the strategies with the read-only token and decides what the run
  # does. No PKGBUILD runs here, so the jobs after it trust the statuses
  # this job hands over.
  check:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    outputs:
      prepare: ${{ steps.decide.outputs.prepare }}
      work: ${{ steps.decide.outputs.work }}
      checked-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git go-yq

      # builder may own no file that the runner mounts into the container,
      # so it gets a fixed uid that no account of the runner has
      - &add-builder
        name: Add builder
        run: |
          useradd -m -u 2000 builder
          if [[ "$(id -u builder)" == "$(stat -c %u "$RUNNER_TEMP")" ]]; then
            echo "::error::builder has the uid of the account that owns $RUNNER_TEMP"
            exit 1
          fi
          owned=$(find /__w /__e \( -user builder -o -group builder \) -print -quit)
          if [[ -n "$owned" ]]; then
            echo "::error::builder owns $owned"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # builder works in /work, and the workspace and
      # aurtomator/ stay root's
      - name: Check updates
        uses: ./aurtomator/.github/actions/run-as-builder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          keep-env: GITHUB_TOKEN
          readme: "true"

      - &stop-builder
        name: Stop builder
        id: stop
        if: always()
        run: |
          # A job that failed before useradd has no builder and no checkout
          uid=$(id -u builder) || exit 0
          # A process builder started can outlive its step. Stop all of
          # them before root reads anything builder wrote. A zombie runs
          # nothing, and pid 1 of a job container never reaps one, so only
          # the other processes count, by effective or real user. live exits
          # with 0 for a running process, 1 for none and 2 when the list
          # fails, and only 1 lets the step go on.
          live() {
            procs=$(ps -e -o uid=,ruid=,stat=) || return 2
            printf '%s\n' "$procs" |
              awk -v u="$uid" '($1 == u || $2 == u) && $3 !~ /^Z/ { n++ } END { exit !n }'
          }
          # kill -1 reaches every process builder may signal in one call,
          # and a fork under way then fails
          sudo -u builder kill -KILL -1 || true
          for _ in $(seq 30); do
            rc=0
            live || rc=$?
            [ "$rc" -eq 1 ] && break
            pkill -KILL -u builder || true
            pkill -KILL -U builder || true
            sleep 1
          done
          rc=0
          live || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::A process of builder is still running, or the process list failed"
            exit 1
          fi

      # Takes what builder wrote as data, now that no process of builder
      # runs. builder reads each file, so a link reaches nothing it cannot.
      - &hand-over
        name: Hand over
        if: always() && steps.stop.outcome == 'success'
        env:
          WORK: /work
          RESULTS: /results
        run: |
          mkdir upload statuses
          install -d -m 0700 "$RESULTS" "$RESULTS/packages"
          [[ -d "$WORK" && ! -L "$WORK" ]] || exit 0
          # Copies file $1 of builder to $2 when it is a regular file
          take() {
            [[ -f "$WORK/$1" && ! -L "$WORK/$1" ]] || return 0
            mkdir -p "$(dirname "$2")"
            # The redirect is root's on purpose
            # shellcheck disable=SC2024
            sudo -u builder cat -- "$WORK/$1" >"$2"
          }
          # A package name never starts with a dot, so . and .. do not match
          name_re='[A-Za-z0-9@_+][A-Za-z0-9@._+-]*'
          if [[ -d "$WORK/handoff" && ! -L "$WORK/handoff" ]]; then
            # find follows no link; -print0, as a name may hold a newline. find
            # fails on a missing prepared/ or status/, and the step goes on.
            (cd "$WORK/handoff" && find prepared status -type f -print0 2>/dev/null || true) |
              while IFS= read -r -d '' f; do
                if [[ "$f" =~ ^prepared/${name_re}/(PKGBUILD|\.SRCINFO|base)$ ]] ||
                  [[ "$f" =~ ^status/${name_re}$ ]]; then
                  take "handoff/$f" "upload/$f"
                fi
              done
          fi
          if [[ -d "$WORK/.status" && ! -L "$WORK/.status" ]]; then
            for f in "$WORK"/.status/*; do
              name=${f##*/}
              [[ "$name" =~ ^${name_re}$ ]] || continue
              take ".status/$name" "statuses/$name"
            done
          fi
          take README.md "$RESULTS/README.md"
          if [[ -d "$WORK/packages" && ! -L "$WORK/packages" ]]; then
            for f in "$WORK"/packages/*.yml; do
              name=${f##*/}
              [[ "$name" =~ ^${name_re}\.yml$ ]] || continue
              take "packages/$name" "$RESULTS/packages/$name"
            done
          fi

      - name: Decide
        id: decide
        env:
          RESULTS: /results
        run: |
          # prepare runs for an outdated package, publish also for a change
          # in the package table
          prepare=false
          if grep -qsE '^(new_version|available_downgrade|new_build): ' statuses/*; then
            prepare=true
          fi
          work=$prepare
          if [[ -f "$RESULTS/README.md" ]] && ! cmp -s "$RESULTS/README.md" README.md; then
            work=true
          fi
          echo "prepare=$prepare" >>"$GITHUB_OUTPUT"
          echo "work=$work" >>"$GITHUB_OUTPUT"

      # The issues job reads them in every run
      - name: Upload statuses
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked
          path: statuses/
          if-no-files-found: error
          retention-days: 1

      # A second layer: the post step of a checkout runs git as root, and
      # does nothing once .git/config is gone
      - &drop-checkouts
        name: Drop the checkouts
        if: always()
        run: rm -rf -- .git aurtomator

  # Every step that executes a PKGBUILD from the AUR runs here, without
  # secrets and without a token. Code from one PKGBUILD can write the files
  # of every package here, so this job only hands over prepared files and
  # update failures, and decides nothing.
  prepare:
    needs: [image, check]
    if: needs.check.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    outputs:
      handoff-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git openssh namcap jq go-yq pacman-contrib

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # By the id of the upload, never by name. No artifact has the id 0, and
      # an empty id would download every artifact of the run.
      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Prepare updates
        uses: ./aurtomator/.github/actions/run-as-builder
        with:
          args: --prepare handoff

      - *stop-builder

      - *hand-over

      - name: Upload handoff
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff
          path: upload/
          # .SRCINFO starts with a dot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Checks the checksums that prepare handed over against the sources, so
  # code from one PKGBUILD cannot forge those of another package. Runs no
  # PKGBUILD and holds no secrets: the downloads from URLs that the AUR sets
  # stay out of the job with the keys.
  verify:
    needs: [image, check, prepare]
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    outputs:
      verified-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git jq go-yq

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # The versions and the asset values that verify-pkg.sh checks against
      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Download handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.handoff-id || '0' }}
          path: handoff

      # git and curl read the AUR repo and the sources here, as builder,
      # who cannot reach the Docker socket that root has in a job container
      - name: Verify checksums
        uses: ./aurtomator/.github/actions/run-as-builder
        with:
          args: --verify handoff

      - *stop-builder

      - *hand-over

      - name: Upload verified handoff
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified
          path: upload/
          # .SRCINFO starts with a dot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Pushes what verify passed on and records the statuses of the check job.
  # Runs also when prepare is skipped, for a change in the package table, and
  # when prepare or verify failed: then it publishes nothing, and every
  # package with a new version gets update_failed. Nothing here executes a
  # PKGBUILD: publish-pkg.sh checks the prepared files against the AUR copy.
  publish:
    needs: [image, check, prepare, verify]
    if: "!cancelled() && needs.check.outputs.work == 'true'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git github-cli openssh gnupg jq go-yq

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Download verified handoff
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.verified-id || '0' }}
          path: handoff

      # Only a package to push needs the SSH and GPG keys, so a run before
      # the secrets are set still commits the README
      - name: Find packages to push
        id: handoff
        run: |
          packages=false
          if compgen -G 'handoff/prepared/*/' >/dev/null; then
            packages=true
          fi
          echo "packages=$packages" >>"$GITHUB_OUTPUT"

      - name: Setup workspace
        env:
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          sudo -u builder git config --global user.name "${AUR_GIT_NAME:-aurtomator}"
          sudo -u builder git config --global user.email "${AUR_GIT_EMAIL:-aurtomator@users.noreply.github.com}"

      - name: Setup AUR SSH
        if: steps.handoff.outputs.packages == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo "::error::The secret AUR_SSH_KEY is empty"
            exit 1
          fi
          SSH_DIR="/home/builder/.ssh"
          mkdir -m 0700 "$SSH_DIR"
          echo "$AUR_SSH_KEY" > "$SSH_DIR/aur"
          chmod 600 "$SSH_DIR/aur"
          # Host key published at https://aur.archlinux.org as
          # Ed25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$SSH_DIR/known_hosts"

          printf '%s\n' \
            "Host aur.archlinux.org" \
            "  IdentityFile $SSH_DIR/aur" \
            "  User aur" \
            "  StrictHostKeyChecking yes" \
            "  ControlMaster auto" \
            "  ControlPath $SSH_DIR/cm-%r@%h:%p" \
            "  ControlPersist 600" \
            > "$SSH_DIR/config"
          chown -R builder:builder "$SSH_DIR"

      - name: Setup GPG
        if: steps.handoff.outputs.packages == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [[ -z "$GPG_SIGNING_KEY" ]]; then
            echo "No GPG key configured, skipping signing"
            exit 0
          fi
          echo "$GPG_SIGNING_KEY" | sudo -u builder gpg --batch --import
          GPG_KEY_ID=$(sudo -u builder gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          sudo -u builder git config --global user.signingkey "$GPG_KEY_ID"
          sudo -u builder git config --global commit.gpgsign true

      # GPG_KEY_ID comes from Setup GPG, when a key is set. git refuses an
      # empty author name or email in the environment.
      - name: Publish updates
        uses: ./aurtomator/.github/actions/run-as-builder
        env:
          GIT_AUTHOR_NAME: ${{ secrets.AUR_GIT_NAME || 'aurtomator' }}
          GIT_AUTHOR_EMAIL: ${{ secrets.AUR_GIT_EMAIL || 'aurtomator@users.noreply.github.com' }}
        with:
          args: --publish handoff
          keep-env: GPG_KEY_ID,GIT_AUTHOR_NAME,GIT_AUTHOR_EMAIL
          readme: "true"

      - *stop-builder

      - *hand-over

      # Root writes stats/ from the journal of the checkout and the copies of
      # Hand over. A failure leaves stats/ out of the commit.
      - name: Record statistics
        env:
          RESULTS: /results
        run: |
          [[ -d "$RESULTS/packages" ]] || exit 0
          compgen -G 'packages/*.yml' >/dev/null || exit 0
          mkdir -p "$RESULTS/stats"
          if ! ./aurtomator/scripts/record-events.sh --journal stats/events.csv --statuses statuses \
            --before packages --after "$RESULTS/packages" --out "$RESULTS/stats/events.csv" ||
            ! ./aurtomator/scripts/stats-card.sh --journal "$RESULTS/stats/events.csv" --packages packages \
              --name "${GITHUB_REPOSITORY#*/}" --out "$RESULTS/stats"; then
            echo "::warning::The statistics of this run were not recorded"
            rm -f -- "$RESULTS/stats/events.csv" "$RESULTS/stats/card.svg" "$RESULTS/stats/card-dark.svg"
          fi

      - name: Commit changes via API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RESULTS: /results
        run: |
          # README.md and the package YAMLs of the checkout are committed
          # from the copies of Hand over, the files of stats/ from root's
          changed=()
          for copy in "$RESULTS/README.md" "$RESULTS"/packages/*.yml \
            "$RESULTS/stats/events.csv" "$RESULTS/stats/card.svg" "$RESULTS/stats/card-dark.svg"; do
            [[ -f "$copy" ]] || continue
            file=${copy#"$RESULTS"/}
            # The first run with statistics adds the files of stats/
            if [[ "$file" == stats/* && ! -e "$file" && ! -L "$file" && ! -L stats ]]; then
              changed+=("$file")
              continue
            fi
            [[ -f "$file" && ! -L "$file" ]] || continue
            cmp -s -- "$copy" "$file" || changed+=("$file")
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changes to commit"
            exit 0
          fi

          MESSAGE="chore: update package versions [skip ci]"
          if ! printf '%s\n' "${changed[@]}" | grep -qv '^stats/'; then
            MESSAGE="chore: update package statistics [skip ci]"
          fi

          HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha')

          # The tree below replaces each changed file as a whole, so a
          # commit pushed during the run that changed one of them would be
          # lost. Then this run commits nothing, and the next run starts
          # from the new head. builder never writes the checkout, so root's
          # git may trust it.
          git_ws() { git -c safe.directory="$PWD" "$@"; }
          if [[ "$HEAD_SHA" != "$(git_ws rev-parse HEAD)" ]]; then
            remote=$(gh api "repos/$REPO/git/trees/$BASE_TREE?recursive=1" \
              --jq '.tree[] | select(.type == "blob") | .path + " " + .sha')
            for file in "${changed[@]}"; do
              if [[ -e "$file" ]]; then
                grep -qxF -- "$file $(git_ws rev-parse "HEAD:$file")" <<<"$remote" && continue
              else
                cut -d ' ' -f 1 <<<"$remote" | grep -qxF -- "$file" || continue
              fi
              echo "::notice::$file changed on $BRANCH during the run, so the statuses of this run are not committed"
              exit 0
            done
          fi

          TREE_ENTRIES="[]"
          for file in "${changed[@]}"; do
            CONTENT=$(base64 -w0 -- "$RESULTS/$file")
            BLOB_SHA=$(gh api "repos/$REPO/git/blobs" \
              -f content="$CONTENT" \
              -f encoding="base64" \
              --jq '.sha')
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$file" \
              --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')
          done

          TREE_SHA=$(gh api "repos/$REPO/git/trees" \
            --jq '.sha' \
            --method POST \
            -H "Content-Type: application/json" \
            --input <(jq -n --arg base "$BASE_TREE" --argjson tree "$TREE_ENTRIES" \
              '{base_tree: $base, tree: $tree}'))

          COMMIT_SHA=$(gh api "repos/$REPO/git/commits" \
            -f message="$MESSAGE" \
            -f tree="$TREE_SHA" \
            -f "parents[]=$HEAD_SHA" \
            --jq '.sha')

          gh api "repos/$REPO/git/refs/heads/$BRANCH" \
            -f sha="$COMMIT_SHA" \
            -F force=false \
            --method PATCH

          echo "Committed: $COMMIT_SHA (verified)"

      # The issues job reads the statuses of this job, also after a failed
      # step
      - name: Upload statuses
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: statuses/
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Opens and closes the issues in every run that checked, from the statuses
  # of publish when it ran and from those of check otherwise. Holds no
  # secret. No other user runs code in the workspace it checks out, so root
  # writes the bodies with scripts/lib/issue.sh.
  issues:
    name: status
    needs: [image, check, prepare, verify, publish]
    if: "!cancelled() && needs.check.result == 'success'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # The image has no git, so gh cannot read the repository from the
    # checkout
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed github-cli

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - name: Download statuses of check
        if: needs.publish.result == 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Download statuses of publish
        if: needs.publish.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.published-id || '0' }}
          path: .status

      - name: Write the run summary
        run: bash -c 'source ./aurtomator/scripts/lib.sh && run_summary .status' >>"$GITHUB_STEP_SUMMARY"

      # Before the issue step: an open issue of a package holds back a new
      # one, so the check issue of a package whose update now fails has to
      # be closed first. The step runs neither after a failed step nor after
      # a failed publish, so a status that publish did not write closes
      # nothing.
      - name: Close resolved issues
        if: needs.publish.result == 'success' || needs.publish.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_OK: ${{ (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0

          has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
          [[ "$has_issues" != "false" ]] || exit 0
          open=$(gh issue list --label "auto-update" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
          held=$(gh issue list --label "update-held" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')

          lib() {
            bash -c 'source ./aurtomator/scripts/lib.sh && "$@"' _ "$@"
          }

          while read -r number title; do
            [[ -n "$number" ]] || continue
            for status_file in "$STATUS_DIR"/*; do
              [[ -f "$status_file" ]] || continue
              pkg_name=$(basename "$status_file")
              [[ "$pkg_name" == _* ]] && continue
              status=$(cat "$status_file")
              # A check issue closes once the check passes, an update issue
              # and a held issue once the version is in the AUR, so a failed
              # check keeps a held issue open
              case "$title:$status" in
                "❌ $pkg_name: check failed:check_failed:"*) continue ;;
                "❌ $pkg_name: check failed:"*) ;;
                "❌ $pkg_name: update failed:up_to_date" | "❌ $pkg_name: update failed:updated: "* | \
                  "❌ $pkg_name: update failed:downgrade: "* | "❌ $pkg_name: update failed:rebuilt: "*) ;;
                "✋ $pkg_name: update held:up_to_date" | "✋ $pkg_name: update held:updated: "* | \
                  "✋ $pkg_name: update held:downgrade: "* | "✋ $pkg_name: update held:rebuilt: "*) ;;
                *) continue ;;
              esac
              comment=$(lib close_comment "$status_file" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done
          done <<<"$open
          $held"

          # A host issue closes once fewer than HOST_ISSUE_MIN packages of the
          # host, in scripts/lib/issue.sh, failed to check
          hosts=$(lib failed_hosts "$STATUS_DIR")
          failing=$(cut -d ' ' -f 1 <<<"$hosts")
          host_re='^([a-z0-9.-]+): [0-9]+ packages failed to check$'
          while read -r number title; do
            [[ "$title" == "❌ "* && "${title#"❌ "}" =~ $host_re ]] || continue
            host=${BASH_REMATCH[1]}
            grep -qxF -e "$host" <<<"$failing" && continue
            comment=$(lib host_close_comment "$host" "$RUN_URL")
            gh issue close "$number" --comment "$comment"
          done <<<"$open"

          # notify-failure opens this issue, and a run with no failed job
          # closes it
          if [[ "$RUN_OK" == true ]]; then
            while read -r number title; do
              [[ "$title" == "❌ Check AUR Package Updates failed" ]] || continue
              gh issue close "$number" --comment "Run $RUN_URL succeeded."
            done <<<"$open"
          fi

          # The issue of an aurtomator release closes once VERSION holds it
          # or a newer release is out. A run that could not read the latest
          # release has no _upstream and closes nothing.
          if [[ -f "$STATUS_DIR/_upstream" ]]; then
            upstream=$(cat "$STATUS_DIR/_upstream")
            releases=$(gh issue list --label "aurtomator-update" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
            while read -r number title; do
              [[ -n "$number" && "$title" != "🚀 aurtomator ${upstream#newer: } available" ]] || continue
              gh issue close "$number" --comment "The aurtomator release status is \`$upstream\` in $RUN_URL."
            done <<<"$releases"
          fi

      - name: Create issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0

          # gh issue list fails in a repository with Issues turned off. A
          # repository like that gets a notice, and any other failure of the
          # list still fails the step.
          if grep -qsE '^(check_failed|update_failed|held|newer):' "$STATUS_DIR"/* || [[ -s "$STATUS_DIR/_alerts" ]]; then
            has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
            if [[ "$has_issues" == "false" ]]; then
              echo "::notice::Issues are disabled in $GITHUB_REPOSITORY, so the run opens no issue"
              exit 0
            fi
          fi

          lib() {
            bash -c 'source ./aurtomator/scripts/lib.sh && "$@"' _ "$@"
          }

          # Creates label $1 with color $2 and description $3 when it is
          # missing and lists the titles of its open issues, once per label
          declare -A titles=()
          use_label() {
            [[ -z "${titles[$1]+set}" ]] || return 0
            gh label create "$1" --color "$2" --description "$3" 2>/dev/null || true
            titles[$1]=$(gh issue list --label "$1" --state open --limit 1000 --json title --jq '.[].title')
          }

          # Opens an issue with label $1, title $2 and body $3, and turns a
          # refusal of GitHub into a warning
          create_issue() {
            local out
            if out=$(gh issue create --title "$2" --label "$1" --body "$3" 2>&1); then
              echo "$out"
            else
              echo "::warning::Could not create the issue $2: ${out//$'\n'/ }"
            fi
          }

          # Opens an issue with label $1, made with color $2 and description
          # $3 when it is missing, and title $4, unless an open issue of the
          # label has that title. Function $5 of scripts/lib/issue.sh writes
          # the body from status file $6.
          open_issue() {
            use_label "$1" "$2" "$3"
            if grep -qxF -e "$4" <<<"${titles[$1]}"; then
              echo "Issue already open: $4"
              return 0
            fi
            body=$(lib "$5" "$6" "$RUN_URL")
            create_issue "$1" "$4" "$body"
          }

          # The packages of a host that failed HOST_ISSUE_MIN or more checks,
          # in scripts/lib/issue.sh, share one issue
          hosts=$(lib failed_hosts "$STATUS_DIR")
          declare -A shared=()
          while read -r host packages; do
            [[ -n "$host" ]] || continue
            read -ra list <<<"$packages"
            for pkg_name in "${list[@]}"; do
              shared[$pkg_name]=1
            done
            use_label auto-update d73a4a "Automated update failure"
            if grep -qxE "❌ ${host//./\\.}: [0-9]+ packages failed to check" <<<"${titles[auto-update]}"; then
              echo "Issue already open for $host, skipping"
              continue
            fi
            body=$(lib host_issue_body "$STATUS_DIR" "$host" "$RUN_URL" "${list[@]}")
            create_issue auto-update "❌ $host: ${#list[@]} packages failed to check" "$body"
          done <<<"$hosts"

          for status_file in "$STATUS_DIR"/*; do
            [[ -f "$status_file" ]] || continue
            pkg_name=$(basename "$status_file")
            [[ "$pkg_name" == _* || -n "${shared[$pkg_name]:-}" ]] && continue

            status=$(cat "$status_file")
            case "$status" in
              check_failed:*|update_failed:*)
                kind="${status%%:*}"
                use_label auto-update d73a4a "Automated update failure"

                # Exact titles: search splits foo-bar into words, so a
                # search for foo also finds the issue of foo-bar
                if grep -qxF -e "❌ $pkg_name: check failed" -e "❌ $pkg_name: update failed" <<<"${titles[auto-update]}"; then
                  echo "Issue already open for $pkg_name, skipping"
                  continue
                fi

                body=$(lib failure_issue_body "$status_file" "$RUN_URL")
                create_issue auto-update "❌ $pkg_name: ${kind//_/ }" "$body"
                ;;
              "held: "*)
                open_issue update-held fbca04 "Update waits for a hand edit" "✋ $pkg_name: update held" alert_issue_body "$status_file"
                ;;
              "updated: "* | "downgrade: "*)
                # A published update gets an issue for the notices that
                # fired; a hold would have kept it from being published
                if awk -F'\t' -v p="$pkg_name" '$1 == p { found = 1 } END { exit !found }' "$STATUS_DIR/_alerts" 2>/dev/null; then
                  open_issue update-notice 1d76db "Published update needs a hand edit" "🔔 $pkg_name: ${status#*: } notice" alert_issue_body "$status_file"
                fi
                ;;
            esac
          done

          # A newer release of aurtomator gets an issue
          upstream=$(cat "$STATUS_DIR/_upstream" 2>/dev/null || true)
          if [[ "$upstream" == "newer: "* ]]; then
            open_issue aurtomator-update 0e8a16 "Newer aurtomator release" "🚀 aurtomator ${upstream#newer: } available" upstream_issue_body "$STATUS_DIR/_upstream"
          fi
