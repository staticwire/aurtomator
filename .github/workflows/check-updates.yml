name: Check AUR Package Updates

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so that two of them never push divergent commits to the
# same AUR repo. A new run waits for the running one to finish.
concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  # Reads the pinned Arch image from .github/ci-image/Dockerfile, where
  # Dependabot updates its digest
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' .github/ci-image/Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::.github/ci-image/Dockerfile must pin archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  # Runs the strategies with the read-only token and decides what the run
  # does. No PKGBUILD runs here, so the jobs after it trust the statuses
  # this job hands over.
  check:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    outputs:
      prepare: ${{ steps.decide.outputs.prepare }}
      work: ${{ steps.decide.outputs.work }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git go-yq
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder .
          sudo --preserve-env=GITHUB_TOKEN -u builder ./scripts/check-all.sh

      - name: Decide
        id: decide
        run: |
          # prepare runs for an outdated package, publish also for a change
          # in the status table
          prepare=false
          if grep -qsE '^(new_version|available_downgrade): ' .status/*; then
            prepare=true
          fi
          sudo -u builder ./scripts/update-readme.sh
          work=$prepare
          git diff --quiet README.md || work=true
          echo "prepare=$prepare" >>"$GITHUB_OUTPUT"
          echo "work=$work" >>"$GITHUB_OUTPUT"

      - name: Upload statuses
        if: steps.decide.outputs.work == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked
          path: .status/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Every step that executes a PKGBUILD from the AUR runs here, without
  # secrets and without a token. Code from one PKGBUILD can write the files
  # of every package here, so this job only hands over prepared files and
  # update failures, and decides nothing.
  prepare:
    needs: [image, check]
    if: needs.check.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git openssh namcap jq go-yq pacman-contrib
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked
          path: .status

      - name: Prepare updates
        shell: bash
        run: |
          chown -R builder:builder .
          # Root prefixes every line, so no output of a PKGBUILD reaches
          # the runner as a workflow command
          sudo -u builder ./scripts/check-all.sh --prepare handoff 2>&1 | sed 's/^/| /'

      - name: Hand over
        run: |
          # A process started by a PKGBUILD can outlive its step. Stop all
          # of them before root reads anything builder wrote. A zombie runs
          # nothing, and pid 1 of a job container never reaps one, so only
          # the other processes count, by effective or real user. live exits
          # with 0 for a running process, 1 for none and 2 when the list
          # fails, and only 1 lets the step go on.
          uid=$(id -u builder)
          live() {
            procs=$(ps -e -o uid=,ruid=,stat=) || return 2
            printf '%s\n' "$procs" |
              awk -v u="$uid" '($1 == u || $2 == u) && $3 !~ /^Z/ { n++ } END { exit !n }'
          }
          for _ in $(seq 30); do
            rc=0
            live || rc=$?
            [ "$rc" -eq 1 ] && break
            pkill -KILL -u builder || true
            pkill -KILL -U builder || true
            sleep 1
          done
          rc=0
          live || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::A process of builder is still running, or the process list failed"
            exit 1
          fi

          # Copy regular files from the expected paths only, and nothing
          # else gets uploaded. find does not follow symlinks; -print0,
          # because a name may hold a newline. A package name never starts
          # with a dot, so . and .. do not match.
          mkdir upload
          if [[ -d handoff && ! -L handoff ]]; then
            pkg_re='[A-Za-z0-9@_+][A-Za-z0-9@._+-]*'
            (cd handoff && find prepared status -type f -print0 2>/dev/null) |
              while IFS= read -r -d '' f; do
                if [[ "$f" =~ ^prepared/${pkg_re}/(PKGBUILD|\.SRCINFO|base)$ ]] ||
                  [[ "$f" =~ ^status/${pkg_re}$ ]]; then
                  [[ -f "handoff/$f" && ! -L "handoff/$f" ]] || continue
                  install -D -m 0644 "handoff/$f" "upload/$f"
                fi
              done
          fi

      - name: Upload handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff
          path: upload/
          # .SRCINFO starts with a dot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Checks the checksums that prepare handed over against the sources, so
  # code from one PKGBUILD cannot forge those of another package. Runs no
  # PKGBUILD and holds no secrets: the downloads from URLs that the AUR sets
  # stay out of the job with the keys.
  verify:
    needs: [image, prepare]
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed git jq go-yq

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handoff
          path: handoff

      - name: Verify checksums
        run: ./scripts/check-all.sh --verify handoff

      - name: Upload verified handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified
          path: handoff/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Pushes what verify passed on and records the statuses of the check job.
  # Runs also when prepare is skipped, for a change in the status table, and
  # when prepare or verify failed: then it publishes nothing, and every
  # package with a new version gets update_failed and an issue. Nothing here
  # executes a PKGBUILD: publish-pkg.sh checks the prepared files against
  # the AUR copy.
  publish:
    needs: [image, check, prepare, verify]
    if: "!cancelled() && needs.check.outputs.work == 'true'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git github-cli openssh gnupg jq go-yq
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked
          path: .status

      - name: Download verified handoff
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified
          path: handoff

      - name: Setup workspace
        env:
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder git config --global user.name "${AUR_GIT_NAME:-aurtomator}"
          sudo -u builder git config --global user.email "${AUR_GIT_EMAIL:-aurtomator@users.noreply.github.com}"
          chown -R builder:builder .

      - name: Setup AUR SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          SSH_DIR="/home/builder/.ssh"
          mkdir -m 0700 "$SSH_DIR"
          echo "$AUR_SSH_KEY" > "$SSH_DIR/aur"
          chmod 600 "$SSH_DIR/aur"
          # Host key published at https://aur.archlinux.org as
          # Ed25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$SSH_DIR/known_hosts"

          printf '%s\n' \
            "Host aur.archlinux.org" \
            "  IdentityFile $SSH_DIR/aur" \
            "  User aur" \
            "  StrictHostKeyChecking yes" \
            "  ControlMaster auto" \
            "  ControlPath $SSH_DIR/cm-%r@%h:%p" \
            "  ControlPersist 600" \
            > "$SSH_DIR/config"
          chown -R builder:builder "$SSH_DIR"

      - name: Setup GPG
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [[ -z "$GPG_SIGNING_KEY" ]]; then
            echo "No GPG key configured, skipping signing"
            exit 0
          fi
          echo "$GPG_SIGNING_KEY" | sudo -u builder gpg --batch --import
          GPG_KEY_ID=$(sudo -u builder gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          sudo -u builder git config --global user.signingkey "$GPG_KEY_ID"
          sudo -u builder git config --global commit.gpgsign true

      - name: Publish updates
        env:
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo --preserve-env=GITHUB_TOKEN -u builder env \
            GPG_KEY_ID="${GPG_KEY_ID:-}" \
            GIT_AUTHOR_NAME="${AUR_GIT_NAME:-aurtomator}" \
            GIT_AUTHOR_EMAIL="${AUR_GIT_EMAIL:-aurtomator@users.noreply.github.com}" \
            ./scripts/check-all.sh --publish handoff

      - name: Update README status table
        run: sudo -u builder ./scripts/update-readme.sh

      - name: Commit changes via API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Only the files this job writes are committed: the package YAMLs
          # and README.md. A change to any other tracked file fails the step.
          # Through a file, so that a failing git diff stops the step
          list=$(mktemp)
          git diff --name-only -z >"$list"
          mapfile -d '' changed <"$list"
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changes to commit"
            exit 0
          fi
          for file in "${changed[@]}"; do
            if [[ ! "$file" =~ ^(README\.md|packages/[A-Za-z0-9@._+-]+\.yml)$ ]]; then
              echo "::error::Refusing to commit a change to ${file@Q}"
              exit 1
            fi
          done

          MESSAGE="chore: update package versions [skip ci]"

          HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha')

          TREE_ENTRIES="[]"
          for file in "${changed[@]}"; do
            CONTENT=$(base64 -w0 "$file")
            BLOB_SHA=$(gh api "repos/$REPO/git/blobs" \
              -f content="$CONTENT" \
              -f encoding="base64" \
              --jq '.sha')
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$file" \
              --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')
          done

          TREE_SHA=$(echo "$TREE_ENTRIES" | gh api "repos/$REPO/git/trees" \
            --input - \
            -f base_tree="$BASE_TREE" \
            --jq '.sha' \
            --method POST \
            -H "Content-Type: application/json" \
            --input <(jq -n --arg base "$BASE_TREE" --argjson tree "$TREE_ENTRIES" \
              '{base_tree: $base, tree: $tree}'))

          COMMIT_SHA=$(gh api "repos/$REPO/git/commits" \
            -f message="$MESSAGE" \
            -f tree="$TREE_SHA" \
            -f "parents[]=$HEAD_SHA" \
            --jq '.sha')

          gh api "repos/$REPO/git/refs/heads/$BRANCH" \
            -f sha="$COMMIT_SHA" \
            -F force=false \
            --method PATCH

          echo "Committed: $COMMIT_SHA (verified)"

      - name: Create issues for failed packages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0

          for status_file in "$STATUS_DIR"/*; do
            [[ -f "$status_file" ]] || continue
            pkg_name=$(basename "$status_file")
            [[ "$pkg_name" == _* ]] && continue

            status=$(cat "$status_file")
            case "$status" in
              check_failed:*|update_failed:*)
                kind="${status%%:*}"

                gh label create "auto-update" --color "d73a4a" --description "Automated update failure" 2>/dev/null || true

                # Exact titles: search splits foo-bar into words, so a
                # search for foo also finds the issue of foo-bar
                titles=$(gh issue list --label "auto-update" --state open --limit 1000 --json title --jq '.[].title')
                if grep -qxF -e "❌ $pkg_name: check failed" -e "❌ $pkg_name: update failed" <<<"$titles"; then
                  echo "Issue already open for $pkg_name, skipping"
                  continue
                fi

                # builder writes the body, so root runs no code from the
                # workspace while it holds the token
                ISSUE_BODY=$(sudo -u builder bash -c 'source ./scripts/lib.sh && failure_issue_body "$@"' \
                  _ "$status_file" "$RUN_URL")

                gh issue create \
                  --title "❌ $pkg_name: ${kind//_/ }" \
                  --label "auto-update" \
                  --body "$ISSUE_BODY" || echo "Warning: could not create issue (issues may be disabled)"
                echo "Created issue for $pkg_name"
                ;;
            esac
          done
