name: Check AUR Package Updates

# The jobs check out the calling repository at the workspace root and aurtomator at
# job.workflow_sha into aurtomator/. image and issues check out aurtomator alone.
on:
  workflow_call:
    secrets:
      AUR_SSH_KEY:
        required: false
      GPG_SIGNING_KEY:
        required: false
      AUR_GIT_NAME:
        required: false
      AUR_GIT_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from ci-image/archlinux.Dockerfile, whose dated tag and digest Dependabot updates
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      # With an empty ref, actions/checkout takes the default branch of another repository,
      # and the run goes on with that code without an error
      - name: Check the pin
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA: '$SHA'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' ci-image/archlinux.Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel-[0-9]{8}\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ci-image/archlinux.Dockerfile must pin a dated tag of archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  # Runs the strategies with the read-only token and decides what the run does. No PKGBUILD runs
  # and no release is parsed here, so the jobs after it trust the statuses this job hands over.
  check:
    name: check
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 30
    outputs:
      prepare: ${{ steps.decide.outputs.prepare }}
      to-prepare: ${{ steps.decide.outputs.to-prepare }}
      rules: ${{ steps.decide.outputs.rules }}
      to-rules: ${{ steps.decide.outputs.to-rules }}
      work: ${{ steps.decide.outputs.work }}
      checked-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Start the run from a branch: it commits its results to the branch it runs on"
          exit 1

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git go-yq

      # builder must own no file that the runner mounts into the container
      - &add-builder
        name: Add builder
        run: |
          useradd -m -u 2000 builder
          if ! temp_owner=$(stat -c %u "$RUNNER_TEMP"); then
            echo "::error::Could not read the owner of $RUNNER_TEMP"
            exit 1
          fi
          if [[ "$(id -u builder)" == "$temp_owner" ]]; then
            echo "::error::builder has the uid of the account that owns $RUNNER_TEMP"
            exit 1
          fi
          if ! owned=$(find /__w /__e /__t \( -user builder -o -group builder \) -print -quit); then
            echo "::error::find could not search /__w, /__e and /__t for the files of builder"
            exit 1
          fi
          if [[ -n "$owned" ]]; then
            echo "::error::builder owns $owned"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # PKGBUILD code of prepare runs as builder, which needs aurtomator/ alone. Artifacts go
      # to $DATA, and no other file of the checkout grants rights to group or others.
      - &close-files
        name: Close files to builder
        env:
          DATA: /data
        run: |
          install -d -m 0700 "$DATA"
          find . -mindepth 1 -path ./aurtomator -prune -o ! -type l -exec chmod go-rwx -- {} +
          chmod 0711 .
          # The runner mounts its tool cache, the home of the steps and the event files read-write
          for dir in /__t /github/home /github/workflow; do
            if [ -d "$dir" ]; then
              find "$dir" ! -type l -perm /022 -exec chmod go-w -- {} +
            fi
          done
          # The event, the home of the steps, and the step scripts and file commands in RUNNER_TEMP
          # are for root steps and the runner, which owns them
          for dir in /github/home /github/workflow "$RUNNER_TEMP"; do
            if [ -n "$dir" ] && [ -d "$dir" ]; then
              chmod go-rwx -- "$dir"
            fi
          done

      # Fails when builder can write a file of the runner or of root steps, read the checkout,
      # use the Docker socket or get a variable of the runner
      - &check-builder
        name: Check builder
        run: |
          if ! sudo -u builder true; then
            echo "::error::sudo could not run a command as builder"
            exit 1
          fi
          fail=0
          # Runs test with flag $1 on path $2 as builder, which has to fail
          check() {
            if sudo -u builder test "$1" "$2"; then
              echo "::error::builder passes test $1 $2"
              fail=1
            fi
          }
          for path in "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/aurtomator" /__w /__w/_actions /__e /__t /github/home /github/workflow; do
            check -w "$path"
          done
          check -r /var/run/docker.sock
          check -w /var/run/docker.sock
          for path in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/README.md" /data /github/workflow/event.json /github/home \
            "$RUNNER_TEMP" "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"; do
            check -r "$path"
          done
          # find skips the directories builder cannot list or enter, as the workspace after Close files,
          # so aurtomator/ in it, which builder reaches by its name, takes a search of its own
          if ! writable=$(sudo -u builder find /__w /__e /__t /github "$GITHUB_WORKSPACE/aurtomator" \
            \( -writable -print -quit \) -o \( -type d \( ! -readable -o ! -executable \) -prune \)); then
            echo "::error::find could not search /__w, /__e, /__t, /github and $GITHUB_WORKSPACE/aurtomator as builder"
            fail=1
          elif [ -n "$writable" ]; then
            echo "::error::builder can write $writable"
            fail=1
          fi
          names=$(sudo -u builder env | cut -d= -f1)
          if leaked=$(printf '%s\n' "$names" | grep -E '^(GITHUB|ACTIONS|RUNNER)_'); then
            echo "::error::sudo passes $(printf '%s\n' "$leaked" | paste -sd ' ' -) to builder"
            fail=1
          fi
          exit "$fail"

      # builder works in /work, and the workspace and aurtomator/ stay root's. The job rules runs the
      # requires rules of the packages that _rules lists.
      - name: Check updates
        uses: ./aurtomator/.github/actions/run-as-builder # zizmor: ignore[self-repository] run-as-builder runs the scripts of the aurtomator/ checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --rules-later
          keep-env: GITHUB_TOKEN,GITHUB_RUN_NUMBER
          readme: "true"

      - &stop-builder
        name: Stop builder
        id: stop
        if: always()
        run: |
          # Jobs that failed before useradd have no builder to stop
          uid=$(id -u builder) || exit 0
          # Returns 0 while a process of builder runs, 1 for none and 2 when ps fails. pid 1
          # of a job container never reaps a zombie, so a zombie does not count.
          live() {
            procs=$(ps -e -o uid=,ruid=,stat=) || return 2
            printf '%s\n' "$procs" |
              awk -v u="$uid" '($1 == u || $2 == u) && $3 !~ /^Z/ { n++ } END { exit !n }'
          }
          # Processes of builder can outlive their step. kill -1 reaches every process builder
          # may signal in one call, and forks under way then fail.
          sudo -u builder kill -KILL -1 || true
          for _ in $(seq 30); do
            rc=0
            live || rc=$?
            [ "$rc" -eq 1 ] && break
            pkill -KILL -u builder || true
            pkill -KILL -U builder || true
            sleep 1
          done
          rc=0
          live || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::A process of builder is still running, or the process list failed"
            exit 1
          fi

      # Takes what builder wrote as data, once no process of builder runs
      - &hand-over
        name: Hand over
        if: always() && steps.stop.outcome == 'success'
        env:
          DATA: /data
          WORK: /work
          RESULTS: /results
        run: |
          mkdir "$DATA/upload" "$DATA/statuses"
          install -d -m 0700 "$RESULTS" "$RESULTS/packages"
          [[ -d "$WORK" && ! -L "$WORK" ]] || exit 0
          # Copies $WORK/$1 to $2 when it is a regular file of at most $3 bytes. builder reads it,
          # so a link reaches only what builder can read, and head stops one byte past the limit.
          take() {
            [[ -f "$WORK/$1" && ! -L "$WORK/$1" ]] || return 0
            mkdir -p "$(dirname "$2")"
            # The redirect is root's on purpose
            # shellcheck disable=SC2024
            sudo -u builder head -c "$(($3 + 1))" -- "$WORK/$1" >"$2"
            if [ "$(stat -c %s -- "$2")" -gt "$3" ]; then
              rm -f -- "$2"
              echo "::warning::$1 is larger than $3 bytes, so Hand over skips it"
            fi
          }
          # No real file comes near these sizes: the AUR takes no blob above 256,000 bytes, base
          # holds one commit id, and a status keeps at most 3900 bytes of an error
          handoff_max() {
            case "$1" in
              */base) echo 64 ;;
              status/*) echo 65536 ;;
              *) echo 1048576 ;;
            esac
          }
          results_max=16777216
          # Package names never start with a dot, so . and .. do not match
          name_re='[a-z0-9][a-z0-9.+_-]*'
          if [[ -d "$WORK/handoff" && ! -L "$WORK/handoff" ]]; then
            # find follows no link. It fails on a missing prepared/ or status/, and the step goes on.
            (cd "$WORK/handoff" && find prepared status -type f -print0 2>/dev/null || true) |
              while IFS= read -r -d '' f; do
                # status/_unverified lists the packages that verify did not reach
                if [[ "$f" =~ ^prepared/(${name_re})/(PKGBUILD|\.SRCINFO|base)$ ]] ||
                  [[ "$f" =~ ^status/(${name_re}|_unverified)$ ]]; then
                  # Jobs of one package hand over that package alone
                  [[ -z "${PACKAGE:-}" || "${BASH_REMATCH[1]}" == "$PACKAGE" ]] || continue
                  take "handoff/$f" "$DATA/upload/$f" "$(handoff_max "$f")"
                fi
              done
          fi
          if [[ -d "$WORK/.status" && ! -L "$WORK/.status" ]]; then
            for f in "$WORK"/.status/*; do
              name=${f##*/}
              # The records of the run, such as _upstream, start with _
              [[ "$name" =~ ^(${name_re}|_[a-z]+)$ ]] || continue
              take ".status/$name" "$DATA/statuses/$name" "$results_max"
            done
          fi
          take README.md "$RESULTS/README.md" "$results_max"
          if [[ -d "$WORK/packages" && ! -L "$WORK/packages" ]]; then
            for f in "$WORK"/packages/*.yml; do
              name=${f##*/}
              [[ "$name" =~ ^${name_re}\.yml$ ]] || continue
              take "packages/$name" "$RESULTS/packages/$name" "$results_max"
            done
          fi

      - name: Decide
        id: decide
        env:
          DATA: /data
          RESULTS: /results
        run: |
          # Matrices run at most 256 jobs, so prepare takes the first 256 outdated packages
          name_re='^[a-z0-9][a-z0-9.+_-]*$'
          # Only --publish writes _without and only this step writes _deferred and the _rules that
          # publish reads, so the step takes _rules of builder as a list of names and deletes the rest
          declare -A rules_listed=()
          if [[ -f "$DATA/statuses/_rules" && ! -L "$DATA/statuses/_rules" ]]; then
            while IFS= read -r name; do
              [[ ! "$name" =~ $name_re ]] || rules_listed[$name]=1
            done <"$DATA/statuses/_rules"
          fi
          rm -f "$DATA/statuses/_without" "$DATA/statuses/_deferred" "$DATA/statuses/_rules"
          to_prepare=()
          to_rules=()
          deferred=()
          for f in "$DATA"/statuses/*; do
            name=${f##*/}
            [[ -f "$f" && "$name" =~ $name_re ]] || continue
            # Errors of failed checks hold lines of upstream, so the start of a status decides
            case "$(<"$f")" in
              "new_version: "* | "available_downgrade: "* | "new_build: "* | "arch_back: "*) ;;
              *) continue ;;
            esac
            # builder writes the statuses, so a name takes a prepare job only with its YAML
            [[ -f "packages/$name.yml" ]] || continue
            if ((${#to_prepare[@]} < 256)); then
              to_prepare+=("$name")
              [[ -z "${rules_listed[$name]:-}" ]] || to_rules+=("$name")
            else
              deferred+=("$name")
            fi
          done
          prepare=false
          list='[]'
          if ((${#to_prepare[@]} > 0)); then
            prepare=true
            # The pattern lets no quote or backslash into a name
            list=$(printf '"%s",' "${to_prepare[@]}")
            list="[${list%,}]"
          fi
          rules=false
          rules_list='[]'
          if ((${#to_rules[@]} > 0)); then
            rules=true
            rules_list=$(printf '"%s",' "${to_rules[@]}")
            rules_list="[${rules_list%,}]"
            printf '%s\n' "${to_rules[@]}" >"$DATA/statuses/_rules"
          fi
          if ((${#deferred[@]} > 0)); then
            printf '%s\n' "${deferred[@]}" >"$DATA/statuses/_deferred"
            echo "::warning::${#deferred[@]} outdated packages wait for the next run, which prepares at most 256"
          fi
          work=$prepare
          if [[ -f "$RESULTS/README.md" ]] && ! cmp -s "$RESULTS/README.md" README.md; then
            work=true
          fi
          # publish commits aurtomator/aurtomator.sh over a regular aurtomator.sh that differs
          release_runner=aurtomator/aurtomator.sh repo_runner=aurtomator.sh
          if [[ -f "$release_runner" && -f "$repo_runner" && ! -L "$repo_runner" ]] &&
            ! cmp -s "$release_runner" "$repo_runner"; then
            work=true
          fi
          # The windows of the card end today, so publish also runs when the card of today
          # differs from the committed one
          packages=false
          if compgen -G 'packages/*.yml' >/dev/null; then
            packages=true
            if [[ -L stats || (-e stats && ! -d stats) ]]; then
              echo "::warning::stats is a link or no directory, so this run records no statistics"
            elif [[ -L stats/events.csv || (-e stats/events.csv && ! -f stats/events.csv) ]]; then
              echo "::warning::stats/events.csv is a link or no regular file, so this run records no statistics"
            elif [[ ! -e stats/events.csv ]]; then
              work=true
            elif mkdir -p "$RESULTS/stats" &&
              timeout 120 ./aurtomator/scripts/stats-card.sh --journal stats/events.csv --packages packages \
                --name "${GITHUB_REPOSITORY#*/}" --out "$RESULTS/stats" &&
              ! cmp -s "$RESULTS/stats/card.svg" stats/card.svg; then
              work=true
            fi
          fi
          {
            echo "prepare=$prepare"
            echo "work=$work"
            echo "packages=$packages"
            echo "to-prepare=$list"
            echo "rules=$rules"
            echo "to-rules=$rules_list"
          } >>"$GITHUB_OUTPUT"

      # Runs without packages upload _packages, and _upstream when the release check answered
      - name: Upload statuses
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked
          path: /data/statuses/
          if-no-files-found: ${{ steps.decide.outputs.packages == 'true' && 'error' || 'ignore' }}
          retention-days: 1

      # The post step of a checkout runs git as root and does nothing once .git/config is gone
      - &drop-checkouts
        name: Drop the checkouts
        if: always()
        run: rm -rf -- .git aurtomator

  # Every step that executes a PKGBUILD from the AUR runs here, without secrets or a token.
  # Each package gets a job of its own, so the code of a PKGBUILD reaches only its package.
  prepare:
    name: prepare
    needs: [image, check]
    if: needs.check.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.to-prepare) }}
    # Hand over takes the files of this package alone
    env:
      PACKAGE: ${{ matrix.package }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git openssh namcap jq go-yq pacman-contrib

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - *close-files

      - *check-builder

      # By the id of the upload, never by name. Empty ids would download every artifact of
      # the run, and no artifact has the id 0.
      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: /data/status

      - name: Prepare updates
        uses: ./aurtomator/.github/actions/run-as-builder # zizmor: ignore[self-repository] run-as-builder runs the scripts of the aurtomator/ checkout
        with:
          args: --prepare handoff
          package: ${{ matrix.package }}
          statuses: /data/status

      - *stop-builder

      - *hand-over

      # Each attempt gets a directory of its own, so verify can take the newest one of a package
      - name: Name the attempt
        env:
          ATTEMPT: ${{ github.run_attempt }}
          DATA: /data
        run: |
          mkdir "$DATA/handoff-out"
          mv "$DATA/upload" "$DATA/handoff-out/$ATTEMPT"

      - name: Upload handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-${{ matrix.package }}-${{ github.run_attempt }}
          path: /data/handoff-out/
          # .SRCINFO starts with a dot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Runs the requires rules, which download the release of a package and parse its files, without a
  # token or a secret. Each package gets a job of its own, so a release reaches only its package.
  rules:
    name: rules
    needs: [image, check]
    if: needs.check.outputs.rules == 'true'
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.to-rules) }}
    # Hand over the rules takes the file of this package alone
    env:
      PACKAGE: ${{ matrix.package }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git go-yq python ruby

      - *add-builder

      # The requires rules read the Python distributions, the modules and the gems of the repositories
      # with pacman -F, and run on without them
      - name: Sync the files databases
        run: |
          if ! pacman -Fy --noconfirm; then
            echo "::warning::pacman -Fy failed, so the requires rules run without the files databases of the repositories"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - *close-files

      - *check-builder

      # The version of the check run, from which the rules run
      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: /data/status

      - name: Run the requires rules
        uses: ./aurtomator/.github/actions/run-as-builder # zizmor: ignore[self-repository] run-as-builder runs the scripts of the aurtomator/ checkout
        with:
          args: --rules rules
          package: ${{ matrix.package }}
          statuses: /data/status

      - *stop-builder

      # Takes the file that builder wrote for this package as data, at most 64 KiB, in a directory of
      # the attempt, so publish can take the newest one
      - name: Hand over the rules
        if: always() && steps.stop.outcome == 'success'
        env:
          ATTEMPT: ${{ github.run_attempt }}
          DATA: /data
          WORK: /work
        run: |
          out="$DATA/rules-out/$ATTEMPT"
          mkdir -p "$out"
          if [[ ! "$PACKAGE" =~ ^[a-z0-9][a-z0-9.+_-]*$ ]]; then
            echo "::error::Not a package name: $PACKAGE"
            exit 1
          fi
          # Copies $WORK/$1 to $2 when it is a regular file of at most $3 bytes. builder reads it,
          # so a link reaches only what builder can read, and head stops one byte past the limit.
          take() {
            [[ -d "$WORK/rules" && ! -L "$WORK/rules" && -f "$WORK/$1" && ! -L "$WORK/$1" ]] || return 0
            # The redirect is root's on purpose
            # shellcheck disable=SC2024
            sudo -u builder head -c "$(($3 + 1))" -- "$WORK/$1" >"$2"
            if [ "$(stat -c %s -- "$2")" -gt "$3" ]; then
              rm -f -- "$2"
              echo "::warning::$1 is larger than $3 bytes, so Hand over the rules skips it"
            fi
          }
          take "rules/$PACKAGE" "$out/$PACKAGE" 65536

      - name: Upload rules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules-${{ matrix.package }}-${{ github.run_attempt }}
          path: /data/rules-out/
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Checks the checksums from prepare against the sources. It runs no PKGBUILD and holds no
  # secret, so the downloads from URLs that the AUR sets stay out of the job with the keys.
  verify:
    name: verify
    needs: [image, check, prepare]
    # Also after a failed job of prepare, for the packages of the other jobs
    if: "!cancelled() && needs.check.outputs.prepare == 'true'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 30
    outputs:
      verified-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git jq go-yq

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - *close-files

      - *check-builder

      # The versions and the asset values that verify-pkg.sh checks against
      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: /data/status

      # Matrices give no artifact id per job, and only prepare uploads handoff-*. Merged,
      # the files of each attempt stay in its directory.
      - name: Download handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: handoff-*
          merge-multiple: true
          path: /data/handoffs

      # The newest attempt that handed over a package wins
      - name: Take the newest handoffs
        env:
          DATA: /data
        run: |
          name_re='^[a-z0-9][a-z0-9.+_-]*$'
          mkdir "$DATA/handoff"
          cd "$DATA"
          [[ -d handoffs && ! -L handoffs ]] || exit 0
          declare -A newest=()
          for dir in handoffs/*/; do
            attempt=${dir#handoffs/}
            attempt=${attempt%/}
            if [[ ! "$attempt" =~ ^[1-9][0-9]*$ || -L "handoffs/$attempt" ]]; then
              continue
            fi
            for f in "handoffs/$attempt"/prepared/* "handoffs/$attempt"/status/*; do
              name=${f##*/}
              if [[ "$name" =~ $name_re ]] && ((attempt > ${newest[$name]:-0})); then
                newest[$name]=$attempt
              fi
            done
          done
          for name in "${!newest[@]}"; do
            src="handoffs/${newest[$name]}"
            for file in "prepared/$name/PKGBUILD" "prepared/$name/.SRCINFO" "prepared/$name/base" "status/$name"; do
              # No link below the directory of the attempt
              [[ ! -L "$src/${file%%/*}" && ! -L "$src/${file%/*}" && -f "$src/$file" && ! -L "$src/$file" ]] || continue
              # The limits of Hand over in prepare
              case "$file" in
                */base) max=64 ;;
                status/*) max=65536 ;;
                *) max=1048576 ;;
              esac
              if [ "$(stat -c %s -- "$src/$file")" -gt "$max" ]; then
                echo "::warning::$src/$file is larger than $max bytes, so verify skips it"
                continue
              fi
              install -D -m 0644 "$src/$file" "handoff/$file"
            done
          done

      # git and curl read the AUR repo and the sources as builder, who cannot reach the
      # Docker socket that root has in a job container. The run number moves the start of the loop.
      - name: Verify checksums
        uses: ./aurtomator/.github/actions/run-as-builder # zizmor: ignore[self-repository] run-as-builder runs the scripts of the aurtomator/ checkout
        with:
          args: --verify handoff
          statuses: /data/status
          handoff: /data/handoff
          keep-env: GITHUB_RUN_NUMBER

      - *stop-builder

      - *hand-over

      - name: Upload verified handoff
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified
          path: /data/upload/
          # .SRCINFO starts with a dot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Pushes what verify passed and records the statuses of check, also after a failed verify.
  # This job holds the keys, so nothing here executes a PKGBUILD.
  publish:
    name: publish
    needs: [image, check, prepare, verify, rules]
    if: "!cancelled() && needs.check.outputs.work == 'true'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 30
    permissions:
      contents: write # commits README.md, packages/, stats/ and aurtomator.sh
    outputs:
      published-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git github-cli openssh gnupg jq go-yq

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - *close-files

      - *check-builder

      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: /data/status

      - name: Download verified handoff
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.verified-id || '0' }}
          path: /data/handoff

      # Packages on status/_unverified keep the status of the check run, and the failed run gets
      # one issue in place of an issue for each package
      - name: Keep the statuses after a failed verify
        if: needs.check.outputs.prepare == 'true' && needs.verify.result != 'success'
        env:
          DATA: /data
        run: |
          mkdir -p "$DATA/handoff/status"
          for f in packages/*.yml; do
            [ -e "$f" ] || continue
            name=${f#packages/}
            printf '%s\n' "${name%.yml}"
          done >"$DATA/handoff/status/_unverified"

      # Matrices give no artifact id per job, and only rules uploads rules-*. Merged, the file of
      # each attempt stays in its directory.
      - name: Download rules
        if: needs.check.outputs.rules == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rules-*
          merge-multiple: true
          path: /data/rules-in

      # The newest attempt that handed over the rules of a package wins
      - name: Take the newest rules
        env:
          DATA: /data
        run: |
          name_re='^[a-z0-9][a-z0-9.+_-]*$'
          mkdir -p "$DATA/handoff/rules"
          cd "$DATA"
          [[ -d rules-in && ! -L rules-in ]] || exit 0
          declare -A newest=()
          for dir in rules-in/*/; do
            attempt=${dir#rules-in/}
            attempt=${attempt%/}
            if [[ ! "$attempt" =~ ^[1-9][0-9]*$ || -L "rules-in/$attempt" ]]; then
              continue
            fi
            for f in "rules-in/$attempt"/*; do
              name=${f##*/}
              if [[ "$name" =~ $name_re ]] && ((attempt > ${newest[$name]:-0})); then
                newest[$name]=$attempt
              fi
            done
          done
          for name in "${!newest[@]}"; do
            file="rules-in/${newest[$name]}/$name"
            [[ -f "$file" && ! -L "$file" ]] || continue
            if [ "$(stat -c %s -- "$file")" -gt 65536 ]; then
              echo "::warning::$file is larger than 65536 bytes, so publish skips it"
              continue
            fi
            install -D -m 0644 "$file" "handoff/rules/$name"
          done

      # Only a package to push needs the SSH and GPG keys, so a run before the secrets are set
      # still commits the README
      - name: Find packages to push
        id: handoff
        env:
          DATA: /data
        run: |
          packages=false
          if compgen -G "$DATA/handoff/prepared/*/" >/dev/null; then
            packages=true
          fi
          echo "packages=$packages" >>"$GITHUB_OUTPUT"

      - name: Setup workspace
        env:
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          sudo -u builder git config --global user.name "${AUR_GIT_NAME:-aurtomator}"
          sudo -u builder git config --global user.email "${AUR_GIT_EMAIL:-aurtomator@users.noreply.github.com}"

      - name: Setup AUR SSH
        if: steps.handoff.outputs.packages == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo "::error::The secret AUR_SSH_KEY is empty"
            exit 1
          fi
          SSH_DIR="/home/builder/.ssh"
          mkdir -m 0700 "$SSH_DIR"
          echo "$AUR_SSH_KEY" > "$SSH_DIR/aur"
          chmod 600 "$SSH_DIR/aur"
          # https://aur.archlinux.org lists the fingerprint of this host key as
          # Ed25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$SSH_DIR/known_hosts"

          printf '%s\n' \
            "Host aur.archlinux.org" \
            "  IdentityFile $SSH_DIR/aur" \
            "  User aur" \
            "  ConnectTimeout 30" \
            "  StrictHostKeyChecking yes" \
            "  ControlMaster auto" \
            "  ControlPath $SSH_DIR/cm-%r@%h:%p" \
            "  ControlPersist 600" \
            > "$SSH_DIR/config"
          chown -R builder:builder "$SSH_DIR"

      - name: Setup GPG
        if: steps.handoff.outputs.packages == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [[ -z "$GPG_SIGNING_KEY" ]]; then
            echo "No GPG key configured, skipping signing"
            exit 0
          fi
          if ! printf '%s\n' "$GPG_SIGNING_KEY" | sudo -u builder gpg --batch --import; then
            echo "::error::gpg could not import GPG_SIGNING_KEY"
            exit 1
          fi
          keys=$(sudo -u builder gpg --batch --with-colons --list-secret-keys)
          GPG_KEY_ID=$(awk -F: '$1 == "sec" { print $5; exit }' <<<"$keys")
          # Public key blocks import with no secret key, and expired keys or keys with a
          # passphrase cannot sign in batch mode
          if [[ ! "$GPG_KEY_ID" =~ ^[0-9A-F]{16}$ ]] ||
            ! printf 'aurtomator\n' | sudo -u builder gpg --batch --local-user "$GPG_KEY_ID" --sign >/dev/null; then
            echo "::error::GPG_SIGNING_KEY holds no secret key that can sign"
            exit 1
          fi
          echo "GPG_KEY_ID=$GPG_KEY_ID" >>"$GITHUB_ENV"
          sudo -u builder git config --global user.signingkey "$GPG_KEY_ID"
          sudo -u builder git config --global commit.gpgsign true

      # Setup GPG sets GPG_KEY_ID when the secret holds a key. git refuses an empty author name
      # or email in the environment.
      - name: Publish updates
        uses: ./aurtomator/.github/actions/run-as-builder # zizmor: ignore[self-repository] run-as-builder runs the scripts of the aurtomator/ checkout
        env:
          GIT_AUTHOR_NAME: ${{ secrets.AUR_GIT_NAME || 'aurtomator' }}
          GIT_AUTHOR_EMAIL: ${{ secrets.AUR_GIT_EMAIL || 'aurtomator@users.noreply.github.com' }}
        with:
          args: --publish handoff
          keep-env: GPG_KEY_ID,GIT_AUTHOR_NAME,GIT_AUTHOR_EMAIL
          readme: "true"
          statuses: /data/status
          handoff: /data/handoff

      - *stop-builder

      - *hand-over

      # Root writes stats/ from the journal of the checkout and the copies of Hand over. A
      # failure or a timeout leaves stats/ out of the commit.
      - name: Record statistics
        env:
          DATA: /data
          RESULTS: /results
        run: |
          [[ -d "$RESULTS/packages" ]] || exit 0
          compgen -G 'packages/*.yml' >/dev/null || exit 0
          mkdir -p "$RESULTS/stats"
          if ! timeout 120 ./aurtomator/scripts/record-events.sh --journal stats/events.csv --statuses "$DATA/statuses" \
            --before packages --after "$RESULTS/packages" --out "$RESULTS/stats/events.csv" ||
            ! timeout 120 ./aurtomator/scripts/stats-card.sh --journal "$RESULTS/stats/events.csv" --packages packages \
              --name "${GITHUB_REPOSITORY#*/}" --out "$RESULTS/stats"; then
            echo "::warning::The statistics of this run were not recorded"
            rm -f -- "$RESULTS/stats/events.csv" "$RESULTS/stats/card.svg" "$RESULTS/stats/card-dark.svg"
          fi

      - name: Commit changes via API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RESULTS: /results
        run: |
          # The commit takes README.md and the package YAMLs from the copies of Hand over, and
          # stats/ from Record statistics
          changed=()
          for copy in "$RESULTS/README.md" "$RESULTS"/packages/*.yml \
            "$RESULTS/stats/events.csv" "$RESULTS/stats/card.svg" "$RESULTS/stats/card-dark.svg"; do
            [[ -f "$copy" ]] || continue
            file=${copy#"$RESULTS"/}
            if [[ "$file" == stats/* ]]; then
              # Paths under a file would replace the file, and those under a link would follow it
              if [[ -L stats || (-e stats && ! -d stats) ]]; then
                echo "::warning::$file is left out of the commit, stats is a link or no directory"
                continue
              fi
              # The first run with statistics adds the files of stats/
              if [[ ! -e "$file" && ! -L "$file" ]]; then
                changed+=("$file")
                continue
              fi
            fi
            [[ -f "$file" && ! -L "$file" ]] || continue
            cmp -s -- "$copy" "$file" || changed+=("$file")
          done
          # aurtomator/aurtomator.sh replaces a regular aurtomator.sh that differs from it. The
          # step leaves a link and adds no missing file.
          release_runner=aurtomator/aurtomator.sh repo_runner=aurtomator.sh
          if [[ -f "$release_runner" && -f "$repo_runner" && ! -L "$repo_runner" ]] &&
            ! cmp -s "$release_runner" "$repo_runner"; then
            changed+=("$repo_runner")
          fi
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changes to commit"
            exit 0
          fi

          files=$(printf '%s\n' "${changed[@]}")
          if [[ "$files" == "$repo_runner" ]]; then
            MESSAGE="chore: update aurtomator.sh [skip ci]"
          else
            subject="update package versions"
            if ! grep -vxF "$repo_runner" <<<"$files" | grep -qv '^stats/'; then
              subject="update package statistics"
            elif ! grep -q '^packages/' <<<"$files"; then
              subject="update package statuses"
            fi
            if grep -qxF "$repo_runner" <<<"$files"; then
              subject+=" and aurtomator.sh"
            fi
            MESSAGE="chore: $subject [skip ci]"
          fi

          # Branch names can hold # and %, which a URL path reads as a fragment and an escape
          ref_path=$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')
          HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/$ref_path" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha')

          # builder never writes the checkout, so root's git may trust it
          git_ws() { git -c safe.directory="$PWD" "$@"; }
          # The new tree replaces each changed file whole. When a commit pushed during the run
          # changed one of them, this run commits nothing and the next run starts from the new head.
          if [[ "$HEAD_SHA" != "$(git_ws rev-parse HEAD)" ]]; then
            remote=$(gh api "repos/$REPO/git/trees/$BASE_TREE?recursive=1" \
              --jq '.tree[] | select(.type == "blob") | .path + " " + .sha')
            for file in "${changed[@]}"; do
              if [[ -e "$file" ]]; then
                grep -qxF -- "$file $(git_ws rev-parse "HEAD:$file")" <<<"$remote" && continue
              else
                cut -d ' ' -f 1 <<<"$remote" | grep -qxF -- "$file" || continue
              fi
              echo "::notice::$file changed on $BRANCH during the run, so the statuses of this run are not committed"
              exit 0
            done
          fi

          TREE_ENTRIES="[]"
          for file in "${changed[@]}"; do
            from="$RESULTS/$file" mode=100644
            if [[ "$file" == "$repo_runner" ]]; then
              from=$release_runner mode=100755
            fi
            # Linux refuses one argument over 128 KiB, so the file goes on stdin
            BLOB_SHA=$(base64 -w0 -- "$from" |
              jq -Rs '{content: ., encoding: "base64"}' |
              gh api "repos/$REPO/git/blobs" \
                --jq '.sha' \
                --method POST \
                -H "Content-Type: application/json" \
                --input -)
            # Without pipefail a failed base64 hands jq no input, and gh writes an empty blob
            if [[ "$BLOB_SHA" != "$(git_ws hash-object --stdin <"$from")" ]]; then
              echo "::error::The blob of $file differs from the file"
              exit 1
            fi
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$file" \
              --arg mode "$mode" \
              --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": $mode, "type": "blob", "sha": $sha}]')
          done

          TREE_SHA=$(gh api "repos/$REPO/git/trees" \
            --jq '.sha' \
            --method POST \
            -H "Content-Type: application/json" \
            --input <(jq -n --arg base "$BASE_TREE" --argjson tree "$TREE_ENTRIES" \
              '{base_tree: $base, tree: $tree}'))

          COMMIT_SHA=$(gh api "repos/$REPO/git/commits" \
            -f message="$MESSAGE" \
            -f tree="$TREE_SHA" \
            -f "parents[]=$HEAD_SHA" \
            --jq '.sha')

          gh api "repos/$REPO/git/refs/heads/$ref_path" \
            -f sha="$COMMIT_SHA" \
            -F force=false \
            --method PATCH

          echo "Committed: $COMMIT_SHA (verified)"

      # The issues job reads these statuses, also after a failed step
      - name: Upload statuses
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: /data/statuses/
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Opens and closes issues from the statuses of publish, or of check when publish is skipped.
  # No other user runs code in this job, so root runs scripts/lib/issue.sh.
  issues:
    name: status
    needs: [image, check, prepare, verify, rules, publish]
    if: "!cancelled() && needs.check.result == 'success'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # opens issues for the statuses and closes resolved ones
    # This job has no git, so gh cannot read the repository from a checkout
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed github-cli

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # Publish jobs that fail before the step of builder upload no statuses, and then those
      # of check hold every package of the run
      - name: Download statuses of check
        if: (needs.publish.result == 'skipped' || needs.publish.outputs.published-id == '') && needs.check.outputs.checked-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Download statuses of publish
        if: needs.publish.result != 'skipped' && needs.publish.outputs.published-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.published-id || '0' }}
          path: .status

      # Without statuses of publish, the statuses are as builder wrote them in check, so root
      # checks them as publish does
      - name: Check the statuses
        id: clean
        run: bash -c 'source ./aurtomator/scripts/lib.sh && clean_statuses .status'

      - name: Write the run summary
        run: bash -c 'source ./aurtomator/scripts/lib.sh && run_summary .status' >>"$GITHUB_STEP_SUMMARY"

      # Runs before Create issues, since an open issue of a package holds back a new one. After
      # a failed publish it does not run, so a status that publish did not write closes no issue.
      - name: Close resolved issues
        if: needs.publish.result == 'success' || needs.publish.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_OK: ${{ (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (needs.rules.result == 'success' || needs.rules.result == 'skipped') }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0

          has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
          [[ "$has_issues" != "false" ]] || exit 0
          open=$(gh issue list --label "auto-update" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
          held=$(gh issue list --label "update-held" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')

          lib() {
            bash -c 'source ./aurtomator/scripts/lib.sh && "$@"' _ "$@"
          }

          # Read once, since the loop below takes each pair of open issue and package
          declare -A statuses=()
          for status_file in "$STATUS_DIR"/*; do
            [[ -f "$status_file" && "${status_file##*/}" != _* ]] || continue
            statuses[${status_file##*/}]=$(<"$status_file")
          done

          while read -r number title; do
            [[ -n "$number" ]] || continue
            for pkg_name in "${!statuses[@]}"; do
              status=${statuses[$pkg_name]}
              status_file="$STATUS_DIR/$pkg_name"
              # Check issues close when the check passes, and update or held issues when the
              # version is in the AUR
              case "$title:$status" in
                "❌ $pkg_name: check failed:check_failed:"* | "❌ $pkg_name: check failed:unchecked:"*) continue ;;
                "❌ $pkg_name: check failed:"*) ;;
                "❌ $pkg_name: update failed:up_to_date" | "❌ $pkg_name: update failed:updated: "* | \
                  "❌ $pkg_name: update failed:downgrade: "* | "❌ $pkg_name: update failed:rebuilt: "* | \
                  "❌ $pkg_name: update failed:arch_added: "*) ;;
                "✋ $pkg_name: update held:up_to_date" | "✋ $pkg_name: update held:updated: "* | \
                  "✋ $pkg_name: update held:downgrade: "* | "✋ $pkg_name: update held:rebuilt: "* | \
                  "✋ $pkg_name: update held:arch_added: "*) ;;
                *) continue ;;
              esac
              comment=$(lib close_comment "$status_file" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done
          done <<<"$open
          $held"

          # The issues of a package whose YAML is gone close, since no check of it closes them; a
          # run without the list of packages closes none
          if [[ -f "$STATUS_DIR/_packages" ]]; then
            arched=$(gh issue list --label "arch-missing" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
            name_re='[a-z0-9][a-z0-9.+_-]*'
            failed_re="^❌ (${name_re}): (check|update) failed\$"
            held_re="^✋ (${name_re}): update held\$"
            arch_re="^⚠️ (${name_re}): .+ without .+\$"
            while read -r number title; do
              [[ -n "$number" ]] || continue
              [[ "$title" =~ $failed_re || "$title" =~ $held_re || "$title" =~ $arch_re ]] || continue
              pkg_name=${BASH_REMATCH[1]}
              grep -qxF -e "$pkg_name" "$STATUS_DIR/_packages" && continue
              comment=$(lib retired_close_comment "$pkg_name" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done <<<"$open
          $held
          $arched"
          fi

          # notify-failure opens this issue, and a run without a failed job closes it
          if [[ "$RUN_OK" == true ]]; then
            while read -r number title; do
              [[ "$title" == "❌ Check AUR Package Updates failed" ]] || continue
              gh issue close "$number" --comment "Run $RUN_URL succeeded."
            done <<<"$open"
          fi

          # Arch issues close when _without no longer lists their package. Only publish writes
          # _without, so runs without publish close none.
          if [[ -f "$STATUS_DIR/_without" ]]; then
            arched=$(gh issue list --label "arch-missing" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
            title_re='^⚠️ ([a-z0-9][a-z0-9.+_-]*): '
            while read -r number title; do
              [[ -n "$number" && "$title" =~ $title_re ]] || continue
              pkg_name=${BASH_REMATCH[1]}
              awk -F'\t' -v p="$pkg_name" '$1 "" == p "" { found = 1 } END { exit !found }' "$STATUS_DIR/_without" && continue
              comment=$(lib arch_close_comment "$pkg_name" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done <<<"$arched"
          fi

          # Release issues close when VERSION holds the release or a newer one is out. Runs that
          # could not read the latest release have no _upstream and close none.
          if [[ -f "$STATUS_DIR/_upstream" ]]; then
            upstream=$(cat "$STATUS_DIR/_upstream")
            releases=$(gh issue list --label "aurtomator-update" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
            while read -r number title; do
              [[ -n "$number" && "$title" != "🚀 aurtomator ${upstream#newer: } available" ]] || continue
              gh issue close "$number" --comment "The aurtomator release status is \`$upstream\` in $RUN_URL."
            done <<<"$releases"
          fi

      # Host issues rest on the statuses of check alone, so they close after a failed publish too,
      # and before Create issues, which opens no package issue under an open host issue
      - name: Close resolved host issues
        if: always() && steps.clean.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0
          # check-all.sh writes _packages after its loop, so a publish that its job stops leaves none
          [[ -f "$STATUS_DIR/_packages" ]] || exit 0
          # Runs whose check left a package unchecked close none. Errors of failed checks hold
          # lines of upstream, so the start of a status decides.
          for f in "$STATUS_DIR"/*; do
            if [[ -f "$f" && "$(<"$f")" == "unchecked: "* ]]; then
              exit 0
            fi
          done

          has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
          [[ "$has_issues" != "false" ]] || exit 0
          open=$(gh issue list --label "auto-update" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')

          lib() {
            bash -c 'source ./aurtomator/scripts/lib.sh && "$@"' _ "$@"
          }

          # Host issues close when fewer than HOST_ISSUE_MIN packages of the host failed to check
          hosts=$(lib failed_hosts "$STATUS_DIR")
          failing=$(cut -d ' ' -f 1 <<<"$hosts")
          host_re='^([a-z0-9.-]+): [0-9]+ packages failed to check$'
          while read -r number title; do
            [[ "$title" == "❌ "* && "${title#"❌ "}" =~ $host_re ]] || continue
            host=${BASH_REMATCH[1]}
            grep -qxF -e "$host" <<<"$failing" && continue
            comment=$(lib host_close_comment "$host" "$RUN_URL")
            gh issue close "$number" --comment "$comment"
          done <<<"$open"

      - name: Create issues
        if: always() && steps.clean.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0

          # gh issue list fails when Issues are turned off, so the step reads has_issues first and
          # ends with a notice. Any other failure of the list fails the step.
          kinds=false
          for f in "$STATUS_DIR"/*; do
            [[ -f "$f" ]] || continue
            # Errors of failed checks hold lines of upstream, so the start of a status decides
            first=""
            IFS= read -r first <"$f" || true
            case "$first" in
              check_failed:* | update_failed:* | held:* | newer:*) kinds=true ;;
            esac
          done
          if [[ "$kinds" == true || -s "$STATUS_DIR/_alerts" ]] || grep -qs . "$STATUS_DIR/_without"; then
            has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
            if [[ "$has_issues" == "false" ]]; then
              echo "::notice::Issues are disabled in $GITHUB_REPOSITORY, so the run opens no issue"
              exit 0
            fi
          fi

          lib() {
            bash -c 'source ./aurtomator/scripts/lib.sh && "$@"' _ "$@"
          }

          # Creates label $1 with color $2 and description $3 when it is
          # missing and lists the titles of its open issues, once per label
          declare -A titles=()
          use_label() {
            [[ -z "${titles[$1]+set}" ]] || return 0
            gh label create "$1" --color "$2" --description "$3" 2>/dev/null || true
            titles[$1]=$(gh issue list --label "$1" --state open --limit 1000 --json title --jq '.[].title')
          }

          # Opens an issue with label $1, title $2 and body $3, which goes on stdin since Linux refuses
          # one argument over 128 KiB, and turns a refusal of GitHub into a warning and created=false
          create_issue() {
            local out
            created=true
            if out=$(printf '%s' "$3" | gh issue create --title "$2" --label "$1" --body-file - 2>&1); then
              echo "$out"
            else
              created=false
              echo "::warning::Could not create the issue $2: ${out//$'\n'/ }"
            fi
          }

          # Opens an issue with label $1 and title $4 unless one is open. use_label takes $2 and $3,
          # and function $5 of scripts/lib/issue.sh writes the body from status file $6.
          open_issue() {
            use_label "$1" "$2" "$3"
            if grep -qxF -e "$4" <<<"${titles[$1]}"; then
              echo "Issue already open: $4"
              return 0
            fi
            body=$(lib "$5" "$6" "$RUN_URL")
            create_issue "$1" "$4" "$body"
          }

          # The packages of a host with HOST_ISSUE_MIN or more failed checks share one issue
          hosts=$(lib failed_hosts "$STATUS_DIR")
          declare -A shared=()
          while read -r host packages; do
            [[ -n "$host" ]] || continue
            read -ra list <<<"$packages"
            for pkg_name in "${list[@]}"; do
              shared[$pkg_name]=1
            done
            use_label auto-update d73a4a "Automated update failure"
            if grep -qxE "❌ ${host//./\\.}: [0-9]+ packages failed to check" <<<"${titles[auto-update]}"; then
              echo "Issue already open for $host, skipping"
              continue
            fi
            body=$(lib host_issue_body "$STATUS_DIR" "$host" "$RUN_URL" "${list[@]}")
            create_issue auto-update "❌ $host: ${#list[@]} packages failed to check" "$body"
            # The packages of a refused host issue get issues of their own below
            if [[ "$created" == false ]]; then
              for pkg_name in "${list[@]}"; do
                unset 'shared[$pkg_name]'
              done
            fi
          done <<<"$hosts"

          for status_file in "$STATUS_DIR"/*; do
            [[ -f "$status_file" ]] || continue
            pkg_name=$(basename "$status_file")
            [[ "$pkg_name" == _* || -n "${shared[$pkg_name]:-}" ]] && continue

            status=$(cat "$status_file")
            case "$status" in
              check_failed:*|update_failed:*)
                kind="${status%%:*}"
                use_label auto-update d73a4a "Automated update failure"

                # Matches whole titles, since a search for foo also finds the issue of foo-bar
                if grep -qxF -e "❌ $pkg_name: check failed" -e "❌ $pkg_name: update failed" <<<"${titles[auto-update]}"; then
                  echo "Issue already open for $pkg_name, skipping"
                  continue
                fi
                # The open issue of its host holds the failed check of a package, also in a run that
                # left packages of the host unchecked and so counted fewer than HOST_ISSUE_MIN of them
                host=$(lib failure_host "$status_file")
                if [[ -n "$host" ]] && grep -qxE "❌ ${host//./\\.}: [0-9]+ packages failed to check" <<<"${titles[auto-update]}"; then
                  echo "Issue of $host open, so $pkg_name gets none"
                  continue
                fi

                body=$(lib failure_issue_body "$status_file" "$RUN_URL")
                create_issue auto-update "❌ $pkg_name: ${kind//_/ }" "$body"
                ;;
              "held: "*)
                if lib only_waits "$status_file"; then
                  echo "$pkg_name waits for a held package and gets no issue"
                  continue
                fi
                open_issue update-held fbca04 "Update waits for a hand edit" "✋ $pkg_name: update held" alert_issue_body "$status_file"
                ;;
              "updated: "* | "downgrade: "*)
                # The alerts of a published update are notices, since a hold stops the update
                if awk -F'\t' -v p="$pkg_name" '$1 "" == p "" { found = 1 } END { exit !found }' "$STATUS_DIR/_alerts" 2>/dev/null; then
                  open_issue update-notice 1d76db "Published update needs a hand edit" "🔔 $pkg_name: ${status#*: } notice" alert_issue_body "$status_file"
                fi
                ;;
            esac
          done

          # Packages published without some arches have one issue, whatever version its title names
          if [[ -f "$STATUS_DIR/_without" ]]; then
            while IFS=$'\t' read -r pkg_name version arches; do
              [[ -n "$pkg_name" ]] || continue
              use_label arch-missing e99695 "Published without some arches"
              if awk -v p="⚠️ $pkg_name: " 'index($0, p) == 1 { found = 1 } END { exit !found }' <<<"${titles[arch-missing]}"; then
                echo "Issue already open for the arches of $pkg_name"
                continue
              fi
              body=$(lib arch_issue_body "$pkg_name" "$version" "$arches" "$RUN_URL")
              create_issue arch-missing "⚠️ $pkg_name: $version without $arches" "$body"
            done <"$STATUS_DIR/_without"
          fi

          upstream=$(cat "$STATUS_DIR/_upstream" 2>/dev/null || true)
          if [[ "$upstream" == "newer: "* ]]; then
            open_issue aurtomator-update 0e8a16 "Newer aurtomator release" "🚀 aurtomator ${upstream#newer: } available" upstream_issue_body "$STATUS_DIR/_upstream"
          fi
