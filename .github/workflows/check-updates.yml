name: Check AUR Package Updates

# The jobs check out the calling repository at the workspace root and aurtomator at
# job.workflow_sha into aurtomator/. image and issues check out aurtomator alone.
on:
  workflow_call:
    secrets:
      AUR_SSH_KEY:
        required: false
      GPG_SIGNING_KEY:
        required: false
      AUR_GIT_NAME:
        required: false
      AUR_GIT_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from ci-image/Dockerfile, whose digest Dependabot updates
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      # With an empty ref, actions/checkout takes the default branch of another repository,
      # and the run goes on with that code without an error
      - name: Check the pin
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA: '$SHA'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' ci-image/Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ci-image/Dockerfile must pin archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  # Runs the strategies with the read-only token and decides what the run does. No PKGBUILD
  # runs here, so the jobs after it trust the statuses this job hands over.
  check:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    outputs:
      prepare: ${{ steps.decide.outputs.prepare }}
      to-prepare: ${{ steps.decide.outputs.to-prepare }}
      work: ${{ steps.decide.outputs.work }}
      checked-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Start the run from a branch: it commits its results to the branch it runs on"
          exit 1

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git go-yq

      # builder must own no file that the runner mounts into the container
      - &add-builder
        name: Add builder
        run: |
          useradd -m -u 2000 builder
          if ! temp_owner=$(stat -c %u "$RUNNER_TEMP"); then
            echo "::error::Could not read the owner of $RUNNER_TEMP"
            exit 1
          fi
          if [[ "$(id -u builder)" == "$temp_owner" ]]; then
            echo "::error::builder has the uid of the account that owns $RUNNER_TEMP"
            exit 1
          fi
          if ! owned=$(find /__w /__e \( -user builder -o -group builder \) -print -quit); then
            echo "::error::find could not search /__w and /__e for the files of builder"
            exit 1
          fi
          if [[ -n "$owned" ]]; then
            echo "::error::builder owns $owned"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # builder works in /work, and the workspace and aurtomator/ stay root's
      - name: Check updates
        uses: ./aurtomator/.github/actions/run-as-builder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          keep-env: GITHUB_TOKEN,GITHUB_RUN_NUMBER
          readme: "true"

      - &stop-builder
        name: Stop builder
        id: stop
        if: always()
        run: |
          # A job that failed before useradd has no builder to stop
          uid=$(id -u builder) || exit 0
          # Returns 0 while a process of builder runs, 1 for none and 2 when ps fails. pid 1
          # of a job container never reaps a zombie, so a zombie does not count.
          live() {
            procs=$(ps -e -o uid=,ruid=,stat=) || return 2
            printf '%s\n' "$procs" |
              awk -v u="$uid" '($1 == u || $2 == u) && $3 !~ /^Z/ { n++ } END { exit !n }'
          }
          # A process of builder can outlive its step. kill -1 reaches every process builder
          # may signal in one call, and a fork under way then fails.
          sudo -u builder kill -KILL -1 || true
          for _ in $(seq 30); do
            rc=0
            live || rc=$?
            [ "$rc" -eq 1 ] && break
            pkill -KILL -u builder || true
            pkill -KILL -U builder || true
            sleep 1
          done
          rc=0
          live || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::A process of builder is still running, or the process list failed"
            exit 1
          fi

      # Takes what builder wrote as data, once no process of builder runs
      - &hand-over
        name: Hand over
        if: always() && steps.stop.outcome == 'success'
        env:
          WORK: /work
          RESULTS: /results
        run: |
          mkdir upload statuses
          install -d -m 0700 "$RESULTS" "$RESULTS/packages"
          [[ -d "$WORK" && ! -L "$WORK" ]] || exit 0
          # Copies $WORK/$1 to $2 when it is a regular file. builder reads it, so a link reaches
          # only what builder can read.
          take() {
            [[ -f "$WORK/$1" && ! -L "$WORK/$1" ]] || return 0
            mkdir -p "$(dirname "$2")"
            # The redirect is root's on purpose
            # shellcheck disable=SC2024
            sudo -u builder cat -- "$WORK/$1" >"$2"
          }
          # A package name never starts with a dot, so . and .. do not match
          name_re='[A-Za-z0-9@_+][A-Za-z0-9@._+-]*'
          if [[ -d "$WORK/handoff" && ! -L "$WORK/handoff" ]]; then
            # find follows no link. It fails on a missing prepared/ or status/, and the step goes on.
            (cd "$WORK/handoff" && find prepared status -type f -print0 2>/dev/null || true) |
              while IFS= read -r -d '' f; do
                if [[ "$f" =~ ^prepared/(${name_re})/(PKGBUILD|\.SRCINFO|base)$ ]] ||
                  [[ "$f" =~ ^status/(${name_re})$ ]]; then
                  # A job of one package hands over that package alone
                  [[ -z "${PACKAGE:-}" || "${BASH_REMATCH[1]}" == "$PACKAGE" ]] || continue
                  take "handoff/$f" "upload/$f"
                fi
              done
          fi
          if [[ -d "$WORK/.status" && ! -L "$WORK/.status" ]]; then
            for f in "$WORK"/.status/*; do
              name=${f##*/}
              [[ "$name" =~ ^${name_re}$ ]] || continue
              take ".status/$name" "statuses/$name"
            done
          fi
          take README.md "$RESULTS/README.md"
          if [[ -d "$WORK/packages" && ! -L "$WORK/packages" ]]; then
            for f in "$WORK"/packages/*.yml; do
              name=${f##*/}
              [[ "$name" =~ ^${name_re}\.yml$ ]] || continue
              take "packages/$name" "$RESULTS/packages/$name"
            done
          fi

      - name: Decide
        id: decide
        env:
          RESULTS: /results
        run: |
          # A matrix runs at most 256 jobs, so prepare takes the first 256 outdated packages
          name_re='^[A-Za-z0-9@_+][A-Za-z0-9@._+-]*$'
          # Only --publish writes _without and only this step writes _deferred, so the step
          # deletes any copy of them that builder wrote
          rm -f statuses/_without statuses/_deferred
          to_prepare=()
          deferred=()
          for f in statuses/*; do
            name=${f#statuses/}
            [[ -f "$f" && "$name" =~ $name_re ]] || continue
            grep -qE '^(new_version|available_downgrade|new_build|arch_back): ' "$f" || continue
            # builder writes the statuses, so a name takes a prepare job only with its YAML
            [[ -f "packages/$name.yml" ]] || continue
            if ((${#to_prepare[@]} < 256)); then
              to_prepare+=("$name")
            else
              deferred+=("$name")
            fi
          done
          prepare=false
          list='[]'
          if ((${#to_prepare[@]} > 0)); then
            prepare=true
            # The pattern lets no quote or backslash into a name
            list=$(printf '"%s",' "${to_prepare[@]}")
            list="[${list%,}]"
          fi
          if ((${#deferred[@]} > 0)); then
            printf '%s\n' "${deferred[@]}" >statuses/_deferred
            echo "::warning::${#deferred[@]} outdated packages wait for the next run, which prepares at most 256"
          fi
          work=$prepare
          if [[ -f "$RESULTS/README.md" ]] && ! cmp -s "$RESULTS/README.md" README.md; then
            work=true
          fi
          # publish commits aurtomator/aurtomator.sh over a regular aurtomator.sh that differs
          release_runner=aurtomator/aurtomator.sh repo_runner=aurtomator.sh
          if [[ -f "$release_runner" && -f "$repo_runner" && ! -L "$repo_runner" ]] &&
            ! cmp -s "$release_runner" "$repo_runner"; then
            work=true
          fi
          # The windows of the card end today, so publish also runs when the card of today
          # differs from the committed one
          packages=false
          if compgen -G 'packages/*.yml' >/dev/null; then
            packages=true
            if [[ -L stats || (-e stats && ! -d stats) ]]; then
              echo "::warning::stats is a link or no directory, so this run records no statistics"
            elif [[ -L stats/events.csv || (-e stats/events.csv && ! -f stats/events.csv) ]]; then
              echo "::warning::stats/events.csv is a link or no regular file, so this run records no statistics"
            elif [[ ! -e stats/events.csv ]]; then
              work=true
            elif mkdir -p "$RESULTS/stats" &&
              timeout 120 ./aurtomator/scripts/stats-card.sh --journal stats/events.csv --packages packages \
                --name "${GITHUB_REPOSITORY#*/}" --out "$RESULTS/stats" &&
              ! cmp -s "$RESULTS/stats/card.svg" stats/card.svg; then
              work=true
            fi
          fi
          {
            echo "prepare=$prepare"
            echo "work=$work"
            echo "packages=$packages"
            echo "to-prepare=$list"
          } >>"$GITHUB_OUTPUT"

      # A run without a package has no status to upload
      - name: Upload statuses
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked
          path: statuses/
          if-no-files-found: ${{ steps.decide.outputs.packages == 'true' && 'error' || 'ignore' }}
          retention-days: 1

      # The post step of a checkout runs git as root and does nothing once .git/config is gone
      - &drop-checkouts
        name: Drop the checkouts
        if: always()
        run: rm -rf -- .git aurtomator

  # Every step that executes a PKGBUILD from the AUR runs here, without secrets or a token.
  # Each package gets a job of its own, so the code of a PKGBUILD reaches only its package.
  prepare:
    needs: [image, check]
    if: needs.check.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.to-prepare) }}
    # Hand over takes the files of this package alone
    env:
      PACKAGE: ${{ matrix.package }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git openssh namcap jq go-yq pacman-contrib

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # By the id of the upload, never by name. An empty id would download every artifact of
      # the run, and no artifact has the id 0.
      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Prepare updates
        uses: ./aurtomator/.github/actions/run-as-builder
        with:
          args: --prepare handoff
          package: ${{ matrix.package }}

      - *stop-builder

      - *hand-over

      # Each attempt gets a directory of its own, so verify can take the newest one of a package
      - name: Name the attempt
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir handoff-out
          mv upload "handoff-out/$ATTEMPT"

      - name: Upload handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-${{ matrix.package }}-${{ github.run_attempt }}
          path: handoff-out/
          # .SRCINFO starts with a dot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Checks the checksums from prepare against the sources. It runs no PKGBUILD and holds no
  # secret, so the downloads from URLs that the AUR sets stay out of the job with the keys.
  verify:
    needs: [image, check, prepare]
    # Also after a failed job of prepare, for the packages of the other jobs
    if: "!cancelled() && needs.check.outputs.prepare == 'true'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    outputs:
      verified-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git jq go-yq

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      # The versions and the asset values that verify-pkg.sh checks against
      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      # A matrix gives no artifact id per job, and only prepare uploads handoff-*. Merged,
      # the files of each attempt stay in its directory.
      - name: Download handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: handoff-*
          merge-multiple: true
          path: handoffs

      # The newest attempt that handed over a package wins
      - name: Take the newest handoffs
        run: |
          name_re='^[A-Za-z0-9@_+][A-Za-z0-9@._+-]*$'
          mkdir handoff
          [[ -d handoffs && ! -L handoffs ]] || exit 0
          declare -A newest=()
          for dir in handoffs/*/; do
            attempt=${dir#handoffs/}
            attempt=${attempt%/}
            if [[ ! "$attempt" =~ ^[1-9][0-9]*$ || -L "handoffs/$attempt" ]]; then
              continue
            fi
            for f in "handoffs/$attempt"/prepared/* "handoffs/$attempt"/status/*; do
              name=${f##*/}
              if [[ "$name" =~ $name_re ]] && ((attempt > ${newest[$name]:-0})); then
                newest[$name]=$attempt
              fi
            done
          done
          for name in "${!newest[@]}"; do
            src="handoffs/${newest[$name]}"
            for file in "prepared/$name/PKGBUILD" "prepared/$name/.SRCINFO" "prepared/$name/base" "status/$name"; do
              # No link below the directory of the attempt
              [[ ! -L "$src/${file%%/*}" && ! -L "$src/${file%/*}" && -f "$src/$file" && ! -L "$src/$file" ]] || continue
              install -D -m 0644 "$src/$file" "handoff/$file"
            done
          done

      # git and curl read the AUR repo and the sources as builder, who cannot reach the
      # Docker socket that root has in a job container
      - name: Verify checksums
        uses: ./aurtomator/.github/actions/run-as-builder
        with:
          args: --verify handoff

      - *stop-builder

      - *hand-over

      - name: Upload verified handoff
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified
          path: upload/
          # .SRCINFO starts with a dot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Pushes what verify passed and records the statuses of check, also after a failed verify.
  # This job holds the keys, so nothing here executes a PKGBUILD.
  publish:
    needs: [image, check, prepare, verify]
    if: "!cancelled() && needs.check.outputs.work == 'true'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git github-cli openssh gnupg jq go-yq

      - *add-builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - name: Download statuses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Download verified handoff
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.verified-id || '0' }}
          path: handoff

      # Only a package to push needs the SSH and GPG keys, so a run before the secrets are set
      # still commits the README
      - name: Find packages to push
        id: handoff
        run: |
          packages=false
          if compgen -G 'handoff/prepared/*/' >/dev/null; then
            packages=true
          fi
          echo "packages=$packages" >>"$GITHUB_OUTPUT"

      - name: Setup workspace
        env:
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          sudo -u builder git config --global user.name "${AUR_GIT_NAME:-aurtomator}"
          sudo -u builder git config --global user.email "${AUR_GIT_EMAIL:-aurtomator@users.noreply.github.com}"

      - name: Setup AUR SSH
        if: steps.handoff.outputs.packages == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo "::error::The secret AUR_SSH_KEY is empty"
            exit 1
          fi
          SSH_DIR="/home/builder/.ssh"
          mkdir -m 0700 "$SSH_DIR"
          echo "$AUR_SSH_KEY" > "$SSH_DIR/aur"
          chmod 600 "$SSH_DIR/aur"
          # https://aur.archlinux.org lists the fingerprint of this host key as
          # Ed25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$SSH_DIR/known_hosts"

          printf '%s\n' \
            "Host aur.archlinux.org" \
            "  IdentityFile $SSH_DIR/aur" \
            "  User aur" \
            "  StrictHostKeyChecking yes" \
            "  ControlMaster auto" \
            "  ControlPath $SSH_DIR/cm-%r@%h:%p" \
            "  ControlPersist 600" \
            > "$SSH_DIR/config"
          chown -R builder:builder "$SSH_DIR"

      - name: Setup GPG
        if: steps.handoff.outputs.packages == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [[ -z "$GPG_SIGNING_KEY" ]]; then
            echo "No GPG key configured, skipping signing"
            exit 0
          fi
          echo "$GPG_SIGNING_KEY" | sudo -u builder gpg --batch --import
          GPG_KEY_ID=$(sudo -u builder gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          sudo -u builder git config --global user.signingkey "$GPG_KEY_ID"
          sudo -u builder git config --global commit.gpgsign true

      # Setup GPG sets GPG_KEY_ID when the secret holds a key. git refuses an empty author name
      # or email in the environment.
      - name: Publish updates
        uses: ./aurtomator/.github/actions/run-as-builder
        env:
          GIT_AUTHOR_NAME: ${{ secrets.AUR_GIT_NAME || 'aurtomator' }}
          GIT_AUTHOR_EMAIL: ${{ secrets.AUR_GIT_EMAIL || 'aurtomator@users.noreply.github.com' }}
        with:
          args: --publish handoff
          keep-env: GPG_KEY_ID,GIT_AUTHOR_NAME,GIT_AUTHOR_EMAIL
          readme: "true"

      - *stop-builder

      - *hand-over

      # Root writes stats/ from the journal of the checkout and the copies of Hand over. A
      # failure or a timeout leaves stats/ out of the commit.
      - name: Record statistics
        env:
          RESULTS: /results
        run: |
          [[ -d "$RESULTS/packages" ]] || exit 0
          compgen -G 'packages/*.yml' >/dev/null || exit 0
          mkdir -p "$RESULTS/stats"
          if ! timeout 120 ./aurtomator/scripts/record-events.sh --journal stats/events.csv --statuses statuses \
            --before packages --after "$RESULTS/packages" --out "$RESULTS/stats/events.csv" ||
            ! timeout 120 ./aurtomator/scripts/stats-card.sh --journal "$RESULTS/stats/events.csv" --packages packages \
              --name "${GITHUB_REPOSITORY#*/}" --out "$RESULTS/stats"; then
            echo "::warning::The statistics of this run were not recorded"
            rm -f -- "$RESULTS/stats/events.csv" "$RESULTS/stats/card.svg" "$RESULTS/stats/card-dark.svg"
          fi

      - name: Commit changes via API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RESULTS: /results
        run: |
          # The commit takes README.md and the package YAMLs from the copies of Hand over, and
          # stats/ from Record statistics
          changed=()
          for copy in "$RESULTS/README.md" "$RESULTS"/packages/*.yml \
            "$RESULTS/stats/events.csv" "$RESULTS/stats/card.svg" "$RESULTS/stats/card-dark.svg"; do
            [[ -f "$copy" ]] || continue
            file=${copy#"$RESULTS"/}
            if [[ "$file" == stats/* ]]; then
              # A path under a file would replace the file, and one under a link would follow it
              if [[ -L stats || (-e stats && ! -d stats) ]]; then
                echo "::warning::$file is left out of the commit, stats is a link or no directory"
                continue
              fi
              # The first run with statistics adds the files of stats/
              if [[ ! -e "$file" && ! -L "$file" ]]; then
                changed+=("$file")
                continue
              fi
            fi
            [[ -f "$file" && ! -L "$file" ]] || continue
            cmp -s -- "$copy" "$file" || changed+=("$file")
          done
          # aurtomator/aurtomator.sh replaces a regular aurtomator.sh that differs from it. The
          # step leaves a link and adds no missing file.
          release_runner=aurtomator/aurtomator.sh repo_runner=aurtomator.sh
          if [[ -f "$release_runner" && -f "$repo_runner" && ! -L "$repo_runner" ]] &&
            ! cmp -s "$release_runner" "$repo_runner"; then
            changed+=("$repo_runner")
          fi
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changes to commit"
            exit 0
          fi

          files=$(printf '%s\n' "${changed[@]}")
          if [[ "$files" == "$repo_runner" ]]; then
            MESSAGE="chore: update aurtomator.sh [skip ci]"
          else
            subject="update package versions"
            if ! grep -vxF "$repo_runner" <<<"$files" | grep -qv '^stats/'; then
              subject="update package statistics"
            elif ! grep -q '^packages/' <<<"$files"; then
              subject="update package statuses"
            fi
            if grep -qxF "$repo_runner" <<<"$files"; then
              subject+=" and aurtomator.sh"
            fi
            MESSAGE="chore: $subject [skip ci]"
          fi

          HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha')

          # builder never writes the checkout, so root's git may trust it
          git_ws() { git -c safe.directory="$PWD" "$@"; }
          # The new tree replaces each changed file whole. When a commit pushed during the run
          # changed one of them, this run commits nothing and the next run starts from the new head.
          if [[ "$HEAD_SHA" != "$(git_ws rev-parse HEAD)" ]]; then
            remote=$(gh api "repos/$REPO/git/trees/$BASE_TREE?recursive=1" \
              --jq '.tree[] | select(.type == "blob") | .path + " " + .sha')
            for file in "${changed[@]}"; do
              if [[ -e "$file" ]]; then
                grep -qxF -- "$file $(git_ws rev-parse "HEAD:$file")" <<<"$remote" && continue
              else
                cut -d ' ' -f 1 <<<"$remote" | grep -qxF -- "$file" || continue
              fi
              echo "::notice::$file changed on $BRANCH during the run, so the statuses of this run are not committed"
              exit 0
            done
          fi

          TREE_ENTRIES="[]"
          for file in "${changed[@]}"; do
            from="$RESULTS/$file" mode=100644
            if [[ "$file" == "$repo_runner" ]]; then
              from=$release_runner mode=100755
            fi
            # Linux refuses one argument over 128 KiB, so the file goes on stdin
            BLOB_SHA=$(base64 -w0 -- "$from" |
              jq -Rs '{content: ., encoding: "base64"}' |
              gh api "repos/$REPO/git/blobs" \
                --jq '.sha' \
                --method POST \
                -H "Content-Type: application/json" \
                --input -)
            # Without pipefail a failed base64 hands jq no input, and gh writes an empty blob
            if [[ "$BLOB_SHA" != "$(git_ws hash-object --stdin <"$from")" ]]; then
              echo "::error::The blob of $file differs from the file"
              exit 1
            fi
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$file" \
              --arg mode "$mode" \
              --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": $mode, "type": "blob", "sha": $sha}]')
          done

          TREE_SHA=$(gh api "repos/$REPO/git/trees" \
            --jq '.sha' \
            --method POST \
            -H "Content-Type: application/json" \
            --input <(jq -n --arg base "$BASE_TREE" --argjson tree "$TREE_ENTRIES" \
              '{base_tree: $base, tree: $tree}'))

          COMMIT_SHA=$(gh api "repos/$REPO/git/commits" \
            -f message="$MESSAGE" \
            -f tree="$TREE_SHA" \
            -f "parents[]=$HEAD_SHA" \
            --jq '.sha')

          gh api "repos/$REPO/git/refs/heads/$BRANCH" \
            -f sha="$COMMIT_SHA" \
            -F force=false \
            --method PATCH

          echo "Committed: $COMMIT_SHA (verified)"

      # The issues job reads these statuses, also after a failed step
      - name: Upload statuses
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: statuses/
          if-no-files-found: error
          retention-days: 1

      - *drop-checkouts

  # Opens and closes issues from the statuses of publish, or of check when publish is skipped.
  # No other user runs code in this job, so root runs scripts/lib/issue.sh.
  issues:
    name: status
    needs: [image, check, prepare, verify, publish]
    if: "!cancelled() && needs.check.result == 'success'"
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # This job has no git, so gh cannot read the repository from a checkout
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed github-cli

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - name: Download statuses of check
        if: needs.publish.result == 'skipped' && needs.check.outputs.checked-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.checked-id || '0' }}
          path: .status

      - name: Download statuses of publish
        if: needs.publish.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.published-id || '0' }}
          path: .status

      # With publish skipped, the statuses are as builder wrote them in check, so root checks
      # them as publish does
      - name: Check the statuses
        id: clean
        run: bash -c 'source ./aurtomator/scripts/lib.sh && clean_statuses .status'

      - name: Write the run summary
        run: bash -c 'source ./aurtomator/scripts/lib.sh && run_summary .status' >>"$GITHUB_STEP_SUMMARY"

      # Runs before Create issues, since an open issue of a package holds back a new one. After
      # a failed publish it does not run, so a status that publish did not write closes no issue.
      - name: Close resolved issues
        if: needs.publish.result == 'success' || needs.publish.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_OK: ${{ (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0

          has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
          [[ "$has_issues" != "false" ]] || exit 0
          open=$(gh issue list --label "auto-update" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
          held=$(gh issue list --label "update-held" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')

          lib() {
            bash -c 'source ./aurtomator/scripts/lib.sh && "$@"' _ "$@"
          }

          while read -r number title; do
            [[ -n "$number" ]] || continue
            for status_file in "$STATUS_DIR"/*; do
              [[ -f "$status_file" ]] || continue
              pkg_name=$(basename "$status_file")
              [[ "$pkg_name" == _* ]] && continue
              status=$(cat "$status_file")
              # A check issue closes when the check passes, and an update or held issue when the
              # version is in the AUR
              case "$title:$status" in
                "❌ $pkg_name: check failed:check_failed:"* | "❌ $pkg_name: check failed:unchecked:"*) continue ;;
                "❌ $pkg_name: check failed:"*) ;;
                "❌ $pkg_name: update failed:up_to_date" | "❌ $pkg_name: update failed:updated: "* | \
                  "❌ $pkg_name: update failed:downgrade: "* | "❌ $pkg_name: update failed:rebuilt: "* | \
                  "❌ $pkg_name: update failed:arch_added: "*) ;;
                "✋ $pkg_name: update held:up_to_date" | "✋ $pkg_name: update held:updated: "* | \
                  "✋ $pkg_name: update held:downgrade: "* | "✋ $pkg_name: update held:rebuilt: "* | \
                  "✋ $pkg_name: update held:arch_added: "*) ;;
                *) continue ;;
              esac
              comment=$(lib close_comment "$status_file" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done
          done <<<"$open
          $held"

          # The issues of a package whose YAML is gone close, since no check of it closes them; a
          # run without the list of packages closes none
          if [[ -f "$STATUS_DIR/_packages" ]]; then
            arched=$(gh issue list --label "arch-missing" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
            name_re='[A-Za-z0-9@_+][A-Za-z0-9@._+-]*'
            failed_re="^❌ (${name_re}): (check|update) failed\$"
            held_re="^✋ (${name_re}): update held\$"
            arch_re="^⚠️ (${name_re}): .+ without .+\$"
            while read -r number title; do
              [[ -n "$number" ]] || continue
              [[ "$title" =~ $failed_re || "$title" =~ $held_re || "$title" =~ $arch_re ]] || continue
              pkg_name=${BASH_REMATCH[1]}
              grep -qxF -e "$pkg_name" "$STATUS_DIR/_packages" && continue
              comment=$(lib retired_close_comment "$pkg_name" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done <<<"$open
          $held
          $arched"
          fi

          # A host issue closes when fewer than HOST_ISSUE_MIN packages of the host failed to check,
          # in a run whose check reached every package
          hosts=$(lib failed_hosts "$STATUS_DIR")
          failing=$(cut -d ' ' -f 1 <<<"$hosts")
          host_re='^([a-z0-9.-]+): [0-9]+ packages failed to check$'
          if ! grep -qs '^unchecked: ' "$STATUS_DIR"/*; then
            while read -r number title; do
              [[ "$title" == "❌ "* && "${title#"❌ "}" =~ $host_re ]] || continue
              host=${BASH_REMATCH[1]}
              grep -qxF -e "$host" <<<"$failing" && continue
              comment=$(lib host_close_comment "$host" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done <<<"$open"
          fi

          # notify-failure opens this issue, and a run without a failed job closes it
          if [[ "$RUN_OK" == true ]]; then
            while read -r number title; do
              [[ "$title" == "❌ Check AUR Package Updates failed" ]] || continue
              gh issue close "$number" --comment "Run $RUN_URL succeeded."
            done <<<"$open"
          fi

          # An arch issue closes when _without no longer lists its package. Only publish writes
          # _without, so a run without publish closes none.
          if [[ -f "$STATUS_DIR/_without" ]]; then
            arched=$(gh issue list --label "arch-missing" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
            title_re='^⚠️ ([A-Za-z0-9@_+][A-Za-z0-9@._+-]*): '
            while read -r number title; do
              [[ -n "$number" && "$title" =~ $title_re ]] || continue
              pkg_name=${BASH_REMATCH[1]}
              awk -F'\t' -v p="$pkg_name" '$1 == p { found = 1 } END { exit !found }' "$STATUS_DIR/_without" && continue
              comment=$(lib arch_close_comment "$pkg_name" "$RUN_URL")
              gh issue close "$number" --comment "$comment"
            done <<<"$arched"
          fi

          # A release issue closes when VERSION holds the release or a newer one is out. A run that
          # could not read the latest release has no _upstream and closes none.
          if [[ -f "$STATUS_DIR/_upstream" ]]; then
            upstream=$(cat "$STATUS_DIR/_upstream")
            releases=$(gh issue list --label "aurtomator-update" --state open --limit 1000 --json number,title --jq '.[] | "\(.number) \(.title)"')
            while read -r number title; do
              [[ -n "$number" && "$title" != "🚀 aurtomator ${upstream#newer: } available" ]] || continue
              gh issue close "$number" --comment "The aurtomator release status is \`$upstream\` in $RUN_URL."
            done <<<"$releases"
          fi

      - name: Create issues
        if: always() && steps.clean.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_DIR=".status"
          [[ -d "$STATUS_DIR" ]] || exit 0

          # gh issue list fails when Issues are turned off, so the step reads has_issues first and
          # ends with a notice. Any other failure of the list fails the step.
          if grep -qsE '^(check_failed|update_failed|held|newer):' "$STATUS_DIR"/* || [[ -s "$STATUS_DIR/_alerts" ]] ||
            grep -qs . "$STATUS_DIR/_without"; then
            has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
            if [[ "$has_issues" == "false" ]]; then
              echo "::notice::Issues are disabled in $GITHUB_REPOSITORY, so the run opens no issue"
              exit 0
            fi
          fi

          lib() {
            bash -c 'source ./aurtomator/scripts/lib.sh && "$@"' _ "$@"
          }

          # Creates label $1 with color $2 and description $3 when it is
          # missing and lists the titles of its open issues, once per label
          declare -A titles=()
          use_label() {
            [[ -z "${titles[$1]+set}" ]] || return 0
            gh label create "$1" --color "$2" --description "$3" 2>/dev/null || true
            titles[$1]=$(gh issue list --label "$1" --state open --limit 1000 --json title --jq '.[].title')
          }

          # Opens an issue with label $1, title $2 and body $3, and turns a
          # refusal of GitHub into a warning
          create_issue() {
            local out
            if out=$(gh issue create --title "$2" --label "$1" --body "$3" 2>&1); then
              echo "$out"
            else
              echo "::warning::Could not create the issue $2: ${out//$'\n'/ }"
            fi
          }

          # Opens an issue with label $1 and title $4 unless one is open. use_label takes $2 and $3,
          # and function $5 of scripts/lib/issue.sh writes the body from status file $6.
          open_issue() {
            use_label "$1" "$2" "$3"
            if grep -qxF -e "$4" <<<"${titles[$1]}"; then
              echo "Issue already open: $4"
              return 0
            fi
            body=$(lib "$5" "$6" "$RUN_URL")
            create_issue "$1" "$4" "$body"
          }

          # The packages of a host with HOST_ISSUE_MIN or more failed checks share one issue
          hosts=$(lib failed_hosts "$STATUS_DIR")
          declare -A shared=()
          while read -r host packages; do
            [[ -n "$host" ]] || continue
            read -ra list <<<"$packages"
            for pkg_name in "${list[@]}"; do
              shared[$pkg_name]=1
            done
            use_label auto-update d73a4a "Automated update failure"
            if grep -qxE "❌ ${host//./\\.}: [0-9]+ packages failed to check" <<<"${titles[auto-update]}"; then
              echo "Issue already open for $host, skipping"
              continue
            fi
            body=$(lib host_issue_body "$STATUS_DIR" "$host" "$RUN_URL" "${list[@]}")
            create_issue auto-update "❌ $host: ${#list[@]} packages failed to check" "$body"
          done <<<"$hosts"

          for status_file in "$STATUS_DIR"/*; do
            [[ -f "$status_file" ]] || continue
            pkg_name=$(basename "$status_file")
            [[ "$pkg_name" == _* || -n "${shared[$pkg_name]:-}" ]] && continue

            status=$(cat "$status_file")
            case "$status" in
              check_failed:*|update_failed:*)
                kind="${status%%:*}"
                use_label auto-update d73a4a "Automated update failure"

                # Matches whole titles, since a search for foo also finds the issue of foo-bar
                if grep -qxF -e "❌ $pkg_name: check failed" -e "❌ $pkg_name: update failed" <<<"${titles[auto-update]}"; then
                  echo "Issue already open for $pkg_name, skipping"
                  continue
                fi

                body=$(lib failure_issue_body "$status_file" "$RUN_URL")
                create_issue auto-update "❌ $pkg_name: ${kind//_/ }" "$body"
                ;;
              "held: "*)
                open_issue update-held fbca04 "Update waits for a hand edit" "✋ $pkg_name: update held" alert_issue_body "$status_file"
                ;;
              "updated: "* | "downgrade: "*)
                # The alerts of a published update are notices, since a hold stops the update
                if awk -F'\t' -v p="$pkg_name" '$1 == p { found = 1 } END { exit !found }' "$STATUS_DIR/_alerts" 2>/dev/null; then
                  open_issue update-notice 1d76db "Published update needs a hand edit" "🔔 $pkg_name: ${status#*: } notice" alert_issue_body "$status_file"
                fi
                ;;
            esac
          done

          # A package published without some arches has one issue, whatever version its title names
          if [[ -f "$STATUS_DIR/_without" ]]; then
            while IFS=$'\t' read -r pkg_name version arches; do
              [[ -n "$pkg_name" ]] || continue
              use_label arch-missing e99695 "Published without some arches"
              if awk -v p="⚠️ $pkg_name: " 'index($0, p) == 1 { found = 1 } END { exit !found }' <<<"${titles[arch-missing]}"; then
                echo "Issue already open for the arches of $pkg_name"
                continue
              fi
              body=$(lib arch_issue_body "$pkg_name" "$version" "$arches" "$RUN_URL")
              create_issue arch-missing "⚠️ $pkg_name: $version without $arches" "$body"
            done <"$STATUS_DIR/_without"
          fi

          upstream=$(cat "$STATUS_DIR/_upstream" 2>/dev/null || true)
          if [[ "$upstream" == "newer: "* ]]; then
            open_issue aurtomator-update 0e8a16 "Newer aurtomator release" "🚀 aurtomator ${upstream#newer: } available" upstream_issue_body "$STATUS_DIR/_upstream"
          fi
