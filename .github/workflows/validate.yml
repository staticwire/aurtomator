name: Validate packages

# Checks the packages of the calling repository with validate-pkg.sh of aurtomator at
# job.workflow_sha, on any trigger the calling workflow picks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from ci-image/archlinux.Dockerfile, whose dated tag and digest Dependabot updates
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      # With an empty ref, actions/checkout takes the default branch of another repository,
      # and the run goes on with that code without an error
      - name: Check the pin
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA: '$SHA'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' ci-image/archlinux.Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel-[0-9]{8}\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ci-image/archlinux.Dockerfile must pin a dated tag of archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  packages:
    name: packages
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 10

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed sudo git go-yq

      # Check the requirements of changed packages compares HEAD with the base of the push or pull request
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - name: Add builder
        uses: ./aurtomator/.github/actions/add-builder # zizmor: ignore[self-repository] add-builder runs from the aurtomator/ checkout

      - name: Validate packages
        run: ./aurtomator/scripts/validate-pkg.sh --all

      # The requires rules read the requirements of each new version, so validate-pkg.sh reads them online
      # for the packages that the push or the pull request adds or changes, and for all when the base is
      # missing or no job of its workflows calls validate.yml at this commit. builder downloads and parses
      # the releases, with copies of their YAMLs in a directory of its own.
      - name: Check the requirements of changed packages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PIN: ${{ job.workflow_sha }}
          WORK: /work
        run: |
          set -o pipefail
          name_re='^[a-z0-9][a-z0-9.+_-]*$'
          script="$GITHUB_WORKSPACE/aurtomator/scripts/validate-pkg.sh"
          if ! sudo -u builder test -x "$script"; then
            echo "::error::builder cannot run $script"
            exit 1
          fi
          # Directories of an earlier step could hold files that builder chose
          if [[ -e "$WORK" || -L "$WORK" ]]; then
            echo "::error::$WORK exists already"
            exit 1
          fi
          # actions/checkout trusts the checkout in a git config of its own, and root does not own it
          git_ws() { git -c safe.directory="$PWD" "$@"; }
          # Prints the uses: of the jobs in the workflows of the base
          base_calls() {
            git_ws ls-tree --name-only "$BASE" -- .github/workflows/ | while IFS= read -r wf; do
              git_ws show "$BASE:$wf" | yq '.jobs[] | select(has("uses")) | .uses' 2>/dev/null || true
            done
          }
          calls=""
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ && "$PIN" =~ ^[0-9a-f]{40}$ ]] &&
            git_ws cat-file -e "$BASE^{commit}" 2>/dev/null; then
            calls=$(base_calls) || calls=""
          fi
          if grep -qxE "[^/]+/[^/]+/\.github/workflows/validate\.yml@$PIN" <<<"$calls"; then
            files=$(git_ws diff --no-renames --name-only --diff-filter=AM "$BASE" HEAD -- packages)
          else
            files=$(printf '%s\n' packages/*.yml)
          fi
          install -d -m 0700 "$WORK" "$WORK/packages"
          names=()
          while IFS= read -r f; do
            name=${f#packages/}
            name=${name%.yml}
            [[ "$f" == packages/*.yml && "$name" =~ $name_re && -f "$f" && ! -L "$f" ]] || continue
            install -m 0644 "$f" "$WORK/packages/$name.yml"
            names+=("$name")
          done <<<"$files"
          chown -R builder:builder "$WORK"
          # The runner ignores workflow commands until it reads the token, which builder never sees.
          # cat ends when no process of builder holds the pipe, so the token comes last.
          token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$token"
          fail=0
          for name in "${names[@]}"; do
            (cd "$WORK" && sudo -u builder "$script" "$name") 2>&1 | cat || fail=1
          done
          echo "::$token::"
          exit "$fail"

      - name: Stop builder
        if: always()
        uses: ./aurtomator/.github/actions/stop-builder # zizmor: ignore[self-repository] stop-builder runs from the aurtomator/ checkout
