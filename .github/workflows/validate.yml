name: Validate packages

# Checks the packages of the calling repository with validate-pkg.sh of aurtomator at
# job.workflow_sha, on any trigger the calling workflow picks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from ci-image/Dockerfile, whose dated tag and digest Dependabot updates
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      # With an empty ref, actions/checkout takes the default branch of another repository,
      # and the run goes on with that code without an error
      - name: Check the pin
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not a commit SHA: '$SHA'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' ci-image/Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel-[0-9]{8}\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ci-image/Dockerfile must pin a dated tag of archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  packages:
    name: packages
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 10

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed git go-yq

      # Check the requirements of changed packages compares HEAD with the base of the push or pull request
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout aurtomator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: aurtomator
          persist-credentials: false

      - name: Validate packages
        run: ./aurtomator/scripts/validate-pkg.sh --all

      # The requires rules read the requirements of each new version, so validate-pkg.sh reads them online
      # for the packages that the push or the pull request adds or changes, and for all without a base
      - name: Check the requirements of changed packages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          name_re='^[a-z0-9][a-z0-9.+_-]*$'
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- packages)
          else
            files=$(printf '%s\n' packages/*.yml)
          fi
          fail=0
          while IFS= read -r f; do
            name=${f#packages/}
            name=${name%.yml}
            [[ "$f" == packages/*.yml && "$name" =~ $name_re && -f "$f" && ! -L "$f" ]] || continue
            ./aurtomator/scripts/validate-pkg.sh "$name" || fail=1
          done <<<"$files"
          exit "$fail"
