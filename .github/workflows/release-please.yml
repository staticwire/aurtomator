name: Release

on:
  push:
    branches: [main]
  # merge-image of ci.yml starts a run on main after its merge, which starts no workflow by itself
  workflow_dispatch:

# release-please fails on a release that another run created first, and that run then signs
# nothing, so runs wait for each other; queue: max keeps the next run from canceling a waiting one
concurrency:
  group: release-please
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # Opens the release PR, which writes VERSION, and tags the release at its merge; it runs only in
  # the upstream repository, since forks and template copies carry this file too
  release-please:
    name: release-please
    if: github.repository == 'staticwire/aurtomator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App key is a secret of environment release, whose branch rule admits runs on main alone,
    # and deployment: false records no deployment for the job
    environment:
      name: release
      deployment: false
    # Every write to the repository goes through the token of the App
    permissions:
      contents: read

    steps:
      # GitHub runs the CI of a pull request opened with the workflow token only after an approval,
      # and main requires that CI; a pull request of the release App runs it at once
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # actions/attest signs the archive with a Sigstore certificate for the OIDC token of this job.
  # Every action of a job can ask for that token, so this job holds no App token.
  sign:
    name: sign
    needs: release-please
    if: github.repository == 'staticwire/aurtomator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attaches the archive and publishes the draft release
      id-token: write # actions/attest gets an OIDC token for the Sigstore certificate
      attestations: write # actions/attest stores the attestation
      actions: read # finds the run of a draft that no run published

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the run of the release commit signs its release, so a later run never signs older code
      # with the provenance of a newer commit; a rerun of that run finds the draft again
      - name: Find the release to sign
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version=$(jq -r '.["."]' .github/.release-please-manifest.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The manifest holds no version: $version"
            exit 1
          fi
          # commits/<ref> would also take a branch of that name; annotated tags point at a tag object
          ref=$(gh api "repos/$REPO/git/ref/tags/v$version" --jq '.object.type + " " + .object.sha')
          read -r type tag_sha <<<"$ref"
          if [[ "$type" == tag ]]; then
            tag_sha=$(gh api "repos/$REPO/git/tags/$tag_sha" --jq .object.sha)
          fi
          if [[ "$tag_sha" != "$SHA" ]]; then
            # Runs that fail before sign leave their draft, which a rerun of that run publishes
            draft=$(gh release view "v$version" -R "$REPO" --json isDraft --jq .isDraft)
            if [[ "$draft" == true ]]; then
              run=$(gh run list -R "$REPO" --workflow release-please.yml --commit "$tag_sha" --json url --jq '.[0].url // ""')
              echo "::error::v$version is a draft of the commit $tag_sha; rerun all jobs of ${run:-the run of release-please.yml on that commit} to sign and publish it"
              exit 1
            fi
            echo "v$version is no release of this commit"
            exit 0
          fi
          # gh edits the first draft of a tag, and release-please creates the release again when a
          # run stops between the release and the label of the release PR
          ids=$(gh api "repos/$REPO/releases?per_page=100" --paginate --jq ".[] | select(.draft and .tag_name == \"v$version\") | .id")
          if [[ "$ids" == *$'\n'* ]]; then
            echo "::error::More than one draft release carries the tag v$version; delete all drafts of v$version but one, then rerun the job"
            exit 1
          fi
          draft=$(gh release view "v$version" -R "$REPO" --json isDraft --jq .isDraft)
          if [[ "$draft" != true ]]; then
            echo "v$version is published"
            exit 0
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build the archive
        if: steps.find.outputs.version != ''
        env:
          VERSION: ${{ steps.find.outputs.version }}
        run: git archive --format=tar.gz --prefix="aurtomator-$VERSION/" -o "aurtomator-$VERSION.tar.gz" HEAD

      - if: steps.find.outputs.version != ''
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: aurtomator-${{ steps.find.outputs.version }}.tar.gz

      # Immutable releases lock their files once published, so the draft gets every file first,
      # and --clobber replaces the files that a failed run left
      - name: Attach the archive and publish the release
        if: steps.find.outputs.version != ''
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          archive="aurtomator-$VERSION.tar.gz"
          cp "$BUNDLE" "$archive.sigstore.json"
          jq -ce .dsseEnvelope "$BUNDLE" >"$archive.intoto.jsonl"
          # Files of the draft get published and locked with the release, and the attestation of
          # GitHub covers them, so the draft holds no file but those of this job
          names=$(gh release view "v$VERSION" -R "$REPO" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            case "$name" in
              "" | "$archive" | "$archive.sigstore.json" | "$archive.intoto.jsonl") ;;
              *)
                echo "::error::The draft of v$VERSION holds $name, which sign does not attach"
                exit 1
                ;;
            esac
          done <<<"$names"
          gh release upload "v$VERSION" "$archive" "$archive.sigstore.json" "$archive.intoto.jsonl" -R "$REPO" --clobber
          gh release edit "v$VERSION" -R "$REPO" --draft=false
