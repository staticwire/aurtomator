name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens the release PR, which writes VERSION, and on its merge tags the
  # release. A fork or a template copy carries this file too, so the job
  # runs only in the upstream repository.
  release-please:
    if: github.repository == 'staticwire/aurtomator'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # GitHub runs the CI of a pull request opened with the workflow token
      # only after someone with write access approves it, and main requires
      # that CI. A pull request opened with the token of the release GitHub
      # App runs it at once.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
