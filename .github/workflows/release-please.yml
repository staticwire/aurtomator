name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens the release PR, which writes VERSION, and on its merge tags the
  # release. A fork or a template copy carries this file too, so the job
  # runs only in the upstream repository.
  release-please:
    if: github.repository == 'staticwire/aurtomator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
