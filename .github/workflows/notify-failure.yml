name: Notify Failed Runs

# Opens one issue for a run whose jobs failed before the issues job of check-updates.yml; the
# calling workflow runs it after any result but success
on:
  workflow_call:

permissions:
  actions: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue for the failed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_BRANCH: ${{ github.ref_name }}
        run: |
          title="❌ Check AUR Package Updates failed"

          # gh issue list fails in a repository with Issues turned off
          has_issues=$(gh api "repos/$GH_REPO" --jq .has_issues)
          if [[ "$has_issues" == "false" ]]; then
            echo "::notice::Issues are disabled in $GH_REPO, so the failed run gets no issue"
            exit 0
          fi

          # Exact titles, as in the Create issues step of check-updates.yml
          titles=$(gh issue list --label auto-update --state open --limit 1000 --json title --jq '.[].title')
          if grep -qxF -e "$title" <<<"$titles"; then
            echo "Issue already open, skipping"
            exit 0
          fi

          # GitHub gives a job stopped by timeout-minutes the conclusion `cancelled`, as one canceled by
          # hand, so a canceled job counts as failed after the timeout-minutes of its job
          failed_jq='.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or
            (.conclusion == "cancelled" and .started_at != null and .completed_at != null and
              (.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601) >= 60 *
              ({"image": 5, "check": 30, "prepare": 30, "verify": 30, "publish": 30, "status": 10}[.name | sub("^.* / "; "") | sub(" [(].*$"; "")] // 1e9) - 60)) | .name'

          # A run without a failed job was canceled and gets no issue; a job list that cannot be
          # read opens the issue without the names
          if ! names=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate --jq "$failed_jq"); then
            failed=""
          elif [[ -z "$names" ]]; then
            echo "::notice::No job of the run failed, so the canceled run gets no issue"
            exit 0
          else
            # The name of a matrix job holds a package name, and a code span keeps an @ in it from
            # mentioning a user; a package name holds no backtick
            # shellcheck disable=SC2016
            failed="\`$(sed ':a;N;$!ba;s/\n/`, `/g' <<<"$names")\`"
          fi

          # A code span ends at a run of as many backticks as it opens with, so its fence outruns every
          # run in the branch name, and the spaces, which Markdown drops, let the name end in a backtick
          fence='`'
          while [[ "$RUN_BRANCH" == *"$fence"* ]]; do
            fence+='`'
          done

          gh label create auto-update --color d73a4a --description "Automated update failure" 2>/dev/null || true
          gh issue create --title "$title" --label auto-update --body "$(printf '%s\n' \
            "Run $RUN_URL on $fence $RUN_BRANCH $fence failed in ${failed:-jobs that could not be listed}." \
            "" \
            "Packages may be left unchecked or unpublished until a run succeeds, and that run closes this issue.")"
