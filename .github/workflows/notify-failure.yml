name: Notify Failed Runs

# The issues of the packages come from the publish job. A run that fails
# before it, or in it, opens this one issue instead. A job of the calling
# workflow runs this workflow after the update call ended with a result
# other than success.
on:
  workflow_call:

permissions:
  actions: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue for the failed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_BRANCH: ${{ github.ref_name }}
        run: |
          title="❌ Check AUR Package Updates failed"

          # gh issue list fails in a repository with Issues turned off
          has_issues=$(gh api "repos/$GH_REPO" --jq .has_issues)
          if [[ "$has_issues" == "false" ]]; then
            echo "::notice::Issues are disabled in $GH_REPO, so the failed run gets no issue"
            exit 0
          fi

          # Exact titles, as in the issue step of publish
          titles=$(gh issue list --label auto-update --state open --limit 1000 --json title --jq '.[].title')
          if grep -qxF -e "$title" <<<"$titles"; then
            echo "Issue already open, skipping"
            exit 0
          fi

          # A run with no failed job was canceled and gets no issue. The names
          # of the failed jobs only fill the text, so a list that cannot be
          # read opens the issue without them.
          if ! failed=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")'); then
            failed=""
          elif [[ -z "$failed" ]]; then
            echo "::notice::No job of the run failed, so the canceled run gets no issue"
            exit 0
          fi

          # A code span ends at a run of as many backticks as it opens with, so
          # its fence is longer than any run in the branch name, and the
          # spaces, which Markdown drops, let the name end in a backtick
          fence='`'
          while [[ "$RUN_BRANCH" == *"$fence"* ]]; do
            fence+='`'
          done

          gh label create auto-update --color d73a4a --description "Automated update failure" 2>/dev/null || true
          gh issue create --title "$title" --label auto-update --body "$(printf '%s\n' \
            "Run $RUN_URL on $fence $RUN_BRANCH $fence failed in ${failed:-jobs that could not be listed}." \
            "" \
            "Packages may be left unchecked or unpublished until a run succeeds.")"
