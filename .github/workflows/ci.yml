name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge-image starts a run on main after its merge, which starts no workflow by itself
  workflow_dispatch:

# Pushes to a pull request cancel its older runs, and every other run has a group of its own
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from ci-image/Dockerfile, whose dated tag and digest Dependabot updates
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' ci-image/Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel-[0-9]{8}\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ci-image/Dockerfile must pin a dated tag of archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck, shfmt and actionlint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh strategies/*.sh tests/helpers/*.sh

      - name: shfmt
        run: shfmt -d -i 2 -ci scripts/*.sh scripts/lib/*.sh strategies/*.sh tests/*.bats tests/helpers/*.sh

      # Checks the workflows, and the run blocks with shellcheck
      - name: actionlint
        run: actionlint
      # actionlint skips the run blocks of a composite action, and the default severity of
      # shellcheck fails an unquoted variable, as actionlint does in a workflow
      - name: shellcheck the actions
        run: |
          for action in .github/actions/*/action.yml; do
            yq '.runs.steps[] | select(has("run")) | .run' "$action" >"$RUNNER_TEMP/run.sh"
            shellcheck -s bash "$RUNNER_TEMP/run.sh"
          done
      # The template and every packages repository carry this script
      - name: shellcheck and shfmt the runner
        run: |
          shellcheck aurtomator.sh
          shfmt -d -i 2 -ci aurtomator.sh

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With advanced-security off, zizmor prints its findings and fails the job; by default the
      # action uploads them to code scanning and passes
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          advanced-security: false

  test:
    name: test
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images] the image job accepts only pins by digest
    timeout-minutes: 45
    # bundler installs the gems of the lock and stops on a gem whose checksum differs from it. The
    # bundler of the image runs, whatever version the lock names.
    env:
      BUNDLE_GEMFILE: ci-image/Gemfile
      BUNDLE_FROZEN: "true"
      BUNDLE_PATH: /opt/gems
      BUNDLE_VERSION: system
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed bash bats git go-yq jq curl openssh namcap python ruby ruby-erb ruby-bundler

      # The Arch image builds no locale and leaves out the locale sources but en_US, and the
      # tests of locales fail in CI without en_US.UTF-8 and the source of tr_TR
      - name: Build the locales of the tests
        run: |
          localedef -i en_US -f UTF-8 en_US.UTF-8
          pacman -Sw --noconfirm glibc
          pkg=$(pacman -Sp glibc)
          bsdtar -xf "/var/cache/pacman/pkg/${pkg##*/}" -C / usr/share/i18n/locales/tr_TR

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the coverage tools
        run: bundle install

      - name: Run BATS tests with coverage
        run: |
          bundle exec bashcov -- tests/helpers/bashcov-bats.sh tests/ --recursive
          # Fix absolute paths in Cobertura XML so Codecov can match files
          if [ -f coverage/coverage.xml ]; then
            sed -i "s|<source>.*</source>|<source>.</source>|g" coverage/coverage.xml
          fi

      # codecov-action downloads the newest CLI unless it gets one, and Dependabot moves the
      # versions and hashes of requirements.txt
      - name: Install the Codecov CLI
        run: |
          python -m venv /opt/codecov
          /opt/codecov/bin/pip install --require-hashes --no-deps -r ci-image/requirements.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          # The search of the CLI would take tests/coverage.bats for a report
          disable_search: true
          fail_ci_if_error: false
          binary: /opt/codecov/bin/codecovcli

  # Runs the validator of this commit as a packages repository runs it
  # from its pin
  validate:
    uses: ./.github/workflows/validate.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
    permissions:
      contents: read

  # Runs the pipeline as a packages repository without packages would. Forks get a read-only token,
  # and Dependabot pull requests skip it too, since these permissions would give their code write
  pipeline:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    uses: ./.github/workflows/check-updates.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
    permissions:
      contents: write # publish of check-updates.yml commits to the repository
      issues: write # status of check-updates.yml opens and closes issues

  # Fails a Dependabot pull request that brings a version with a published vulnerability, which
  # stops merge-image and ci-ok. The pull request can move the pin of the action, so it only reads
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      vulnerable-changes: ${{ steps.review.outputs.vulnerable-changes }}

    steps:
      - id: review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  # Opens an issue that lists the vulnerabilities of a failed review, with no action in the job
  vulnerability-issue:
    name: vulnerability-issue
    needs: dependency-review
    if: failure() && needs.dependency-review.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # creates the label and opens the issue

    steps:
      - name: Open an issue for the vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGES: ${{ needs.dependency-review.outputs.vulnerable-changes }}
        run: |
          # The review also fails when the API fails, and then the log of the review tells why
          if [[ -z "$CHANGES" ]] || ! jq -e 'any(.[]; (.vulnerabilities | length) > 0)' <<<"$CHANGES" >/dev/null; then
            echo "The review failed without a vulnerable change, so no issue opens"
            exit 0
          fi
          title="❌ Dependabot #$PR: published vulnerabilities"
          gh label create -R "$REPO" dependency-review --color d73a4a --description "Dependabot update with published vulnerabilities" 2>/dev/null || true
          # Dependabot rebases its pull requests, and each push reviews them again. Labels take
          # triage rights, so an issue of another account with this title does not count
          titles=$(gh issue list -R "$REPO" --label dependency-review --state open --limit 1000 --json title --jq '.[].title')
          if grep -qxF -- "$title" <<<"$titles"; then
            echo "The issue \"$title\" is open already"
            exit 0
          fi
          body="$RUNNER_TEMP/vulnerabilities.md"
          {
            echo "Dependabot pull request #$PR brings versions with published vulnerabilities, so it is not merged by itself."
            echo
            echo "| Package | Version | Severity | Advisory |"
            echo "|---|---|---|---|"
            jq -r '.[] | . as $c | .vulnerabilities[] |
              "| `\($c.name | gsub("[`|\n\r]"; " "))` | `\($c.version | gsub("[`|\n\r]"; " "))` | \(.severity) | [\(.advisory_ghsa_id)](\(.advisory_url)) \(.advisory_summary | gsub("[|\n\r]"; " ")) |"' <<<"$CHANGES"
          } >"$body"
          gh issue create -R "$REPO" --title "$title" --label dependency-review --body-file "$body"

  # Merges a Dependabot pull request that changes only files of ci-image/: the image, the gems
  # and the Python packages of the CI. It waits for the dependency review, and it is off unless
  # the Dependabot secret CI_IMAGE_AUTO_MERGE holds auto-merge-ci-image.
  merge-image:
    name: merge-image
    needs: [lint, test, validate, dependency-review, ci-ok]
    # Without a status function, the skip of pipeline on Dependabot pull requests reaches this job
    if: >- # zizmor: ignore[bot-conditions] user.login checks the author, which cannot be spoofed
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.dependency-review.result == 'success' &&
      needs.ci-ok.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh pr merge writes the squash commit to main
      pull-requests: write # lists the files of the pull request and merges it
      actions: write # gh workflow run starts ci.yml and release-please.yml

    steps:
      - name: Merge image update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Runs that Dependabot starts read Dependabot secrets and no Actions secrets. GitHub masks
          # the value in every line of the log, so the value is a word that the log holds nowhere else.
          AUTO_MERGE: ${{ secrets.CI_IMAGE_AUTO_MERGE }}
        run: |
          if [[ "$AUTO_MERGE" != auto-merge-ci-image ]]; then
            echo "::notice::The Dependabot secret CI_IMAGE_AUTO_MERGE does not hold auto-merge-ci-image, so #$PR stays open"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if [[ -z "$files" ]]; then
            echo "::notice::#$PR lists no file and stays open"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              ci-image/Dockerfile | ci-image/Gemfile | ci-image/Gemfile.lock | ci-image/requirements.in | ci-image/requirements.txt) ;;
              *)
                echo "::notice::#$PR changes $file and stays open"
                exit 0
                ;;
            esac
          done <<<"$files"
          # Merges nothing when the branch moved after the checks passed
          gh pr merge "$PR" -R "$REPO" --squash --match-head-commit "$HEAD_SHA"
          # The merge with the workflow token starts no workflow, and a dispatch does
          gh workflow run ci.yml -R "$REPO" --ref main
          gh workflow run release-please.yml -R "$REPO" --ref main

  # Required by the ruleset in place of the pipeline checks, which a fork
  # skips. always(): a skipped job counts as passed.
  ci-ok:
    name: ci-ok
    needs: [image, lint, zizmor, test, validate, pipeline, dependency-review, vulnerability-issue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Fail when a needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A job that ci-ok needs failed or was canceled"
          exit 1
