name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from .github/ci-image/Dockerfile, where
  # Dependabot updates its digest
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' .github/ci-image/Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::.github/ci-image/Dockerfile must pin archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck, shfmt and actionlint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh strategies/*.sh

      - name: shfmt
        run: shfmt -d -i 2 -ci scripts/*.sh scripts/lib/*.sh strategies/*.sh tests/*.bats tests/helpers/*.sh

      # Checks the workflows, and the run blocks with shellcheck
      - name: actionlint
        run: actionlint
      # actionlint does not check the run blocks of a composite action. The
      # default severity fails an unquoted variable, as actionlint does in a
      # workflow. yq comes with the runner image.
      - name: shellcheck the actions
        run: |
          for action in .github/actions/*/action.yml; do
            yq '.runs.steps[] | select(has("run")) | .run' "$action" >"$RUNNER_TEMP/run.sh"
            shellcheck -s bash "$RUNNER_TEMP/run.sh"
          done

  test:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed bash bats git go-yq jq curl openssh namcap ruby ruby-erb
          gem install bashcov:4.0.0 simplecov-cobertura:4.0.0 --no-document
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package configs
        run: ./scripts/validate-pkg.sh --all

      - name: Run BATS tests with coverage
        run: |
          bashcov -- tests/helpers/bashcov-bats.sh tests/ --recursive
          # Fix absolute paths in Cobertura XML so Codecov can match files
          if [ -f coverage/coverage.xml ]; then
            sed -i "s|<source>.*</source>|<source>.</source>|g" coverage/coverage.xml
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          fail_ci_if_error: false

  # Merges a Dependabot pull request that changes only the CI image, after
  # lint and test passed. Off unless the repository variable
  # CI_IMAGE_AUTO_MERGE is true.
  merge-image:
    needs: [lint, test]
    if: >-
      vars.CI_IMAGE_AUTO_MERGE == 'true' &&
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge image update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if [[ "$files" != ".github/ci-image/Dockerfile" ]]; then
            echo "::notice::#$PR changes more than .github/ci-image/Dockerfile and stays open"
            exit 0
          fi
          # Merges nothing when the branch moved after lint and test
          gh pr merge "$PR" -R "$REPO" --squash --match-head-commit "$HEAD_SHA"
