name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Reads the pinned Arch image from .github/ci-image/Dockerfile, where
  # Dependabot updates its digest
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci-image

      - name: Read image
        id: read
        run: |
          ref=$(sed -n 's/^FROM //p' .github/ci-image/Dockerfile)
          if [[ ! "$ref" =~ ^archlinux:base-devel@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::.github/ci-image/Dockerfile must pin archlinux:base-devel by digest"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: shellcheck -x -S warning scripts/*.sh strategies/*.sh

      - name: shfmt
        run: shfmt -d -i 2 -ci scripts/*.sh strategies/*.sh

  test:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.ref }}
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed bash bats git go-yq curl openssh ruby ruby-erb
          gem install bashcov:4.0.0 simplecov-cobertura:4.0.0 --no-document
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package configs
        run: ./scripts/validate-pkg.sh --all

      - name: Run BATS tests
        run: bats tests/ --recursive

      - name: Generate coverage
        run: |
          bashcov -- bats tests/ --recursive 2>&1 || true
          # Fix absolute paths in Cobertura XML so Codecov can match files
          if [ -f coverage/coverage.xml ]; then
            sed -i "s|<source>.*</source>|<source>.</source>|g" coverage/coverage.xml
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          fail_ci_if_error: false
