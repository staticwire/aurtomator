version: 2
# merge-image merges only a branch that holds the head of main, so one pull request a month
# brings every update of /ci-image
multi-ecosystem-groups:
  ci-image:
    schedule:
      interval: "monthly"
updates:
  # Hostile releases get a week to be found and pulled before Dependabot proposes them; its security
  # updates skip that week, and merge-image merges the updates of /ci-image without review
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # CodeQL refuses an analyze step of another version than its init step
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: "docker"
    directory: "/ci-image"
    multi-ecosystem-group: "ci-image"
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directory: "/ci-image"
    multi-ecosystem-group: "ci-image"
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: "bundler"
    directory: "/ci-image"
    multi-ecosystem-group: "ci-image"
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      site:
        patterns: ["*"]
