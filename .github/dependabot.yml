version: 2
updates:
  # Hostile releases get a week to be found and pulled before Dependabot proposes them; its security
  # updates skip that week, and merge-image merges the updates of /ci-image without review
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/ci-image"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directory: "/ci-image"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      codecov:
        patterns: ["*"]
  - package-ecosystem: "bundler"
    directory: "/ci-image"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      coverage:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      site:
        patterns: ["*"]
