version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/ci-image"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    groups:
      site:
        patterns: ["*"]
