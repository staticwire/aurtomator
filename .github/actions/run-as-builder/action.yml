name: Run check-all.sh as builder
description: >-
  Copies the inputs of builder into a directory of its own, only those of one
  package when package names it, with the YAMLs of the other packages when
  companions is true, runs scripts/check-all.sh there as builder
  with workflow commands stopped, then scripts/update-readme.sh when readme
  is true and check-all.sh succeeded, and exits with the status of the last
  script that ran.

# builder writes its results only into its own directory. The workspace and
# aurtomator/ stay root's, and the Hand over step takes the results as data.

inputs:
  args:
    description: Arguments of check-all.sh
    required: false
    default: ""
  keep-env:
    description: Comma-separated names of the variables of the step that check-all.sh keeps as builder
    required: false
    default: ""
  package:
    description: The one package whose YAML and status builder gets, with nothing of another package
    required: false
    default: ""
  companions:
    description: true gives builder with package the YAMLs of the other packages too, whose upstream.pin_from the requires rules read
    required: false
    default: "false"
  readme:
    description: true runs scripts/update-readme.sh as builder after a successful check-all.sh
    required: false
    default: "false"
  statuses:
    description: Directory of the statuses that builder gets as .status/
    required: false
    default: ""
  handoff:
    description: Directory of the prepared updates and the files of the rules jobs that builder gets as handoff/
    required: false
    default: ""
  gitlab:
    description: Directory of the answers of GitLab.com that root fetched with GITLAB_TOKEN, which builder gets as .gitlab/
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ARGS: ${{ inputs.args }}
        COMPANIONS: ${{ inputs.companions }}
        GITLAB_ANSWERS: ${{ inputs.gitlab }}
        HANDOFF: ${{ inputs.handoff }}
        KEEP_ENV: ${{ inputs.keep-env }}
        PACKAGE: ${{ inputs.package }}
        README_TOO: ${{ inputs.readme }}
        STATUSES: ${{ inputs.statuses }}
        WORK: /work
      run: |
        code=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        # Directories of an earlier step could hold files that builder chose
        if [[ -e "$WORK" || -L "$WORK" ]]; then
          echo "::error::$WORK exists already"
          exit 1
        fi
        if ! sudo -u builder test -x "$code/scripts/check-all.sh"; then
          echo "::error::builder cannot run $code/scripts/check-all.sh"
          exit 1
        fi
        name_re='[a-z0-9][a-z0-9.+_-]*'
        if [[ -n "$PACKAGE" && ! "$PACKAGE" =~ ^${name_re}$ ]]; then
          echo "::error::Not a package name: $PACKAGE"
          exit 1
        fi
        install -d -m 0700 "$WORK"
        # Copies $1 to $WORK/$2 when it is a regular file of at most $3 bytes, never a link
        take() {
          [[ -f "$1" && ! -L "$1" ]] || return 0
          if (($(stat -c %s -- "$1") > $3)); then
            echo "::warning::$2 is larger than $3 bytes, so builder does not get it"
            return 0
          fi
          install -D -m 0644 "$1" "$WORK/$2"
        }
        # The limits of the Hand over steps
        handoff_max() {
          case "$1" in
            */base) echo 64 ;;
            status/* | rules/*) echo 65536 ;;
            *) echo 1048576 ;;
          esac
        }
        results_max=16777216
        # The statuses and the handoff come from the artifacts of the run alone, never from
        # the checkout, so only directories that the step names count
        dir_ok() { [[ -n "$1" && -d "$1" && ! -L "$1" ]]; }
        if [[ -n "$PACKAGE" ]]; then
          # One package: its YAML, its status and the records check-all.sh reads
          if [[ -d packages && ! -L packages ]]; then
            take "packages/$PACKAGE.yml" "packages/$PACKAGE.yml" "$results_max"
            if [[ "$COMPANIONS" == true ]]; then
              for f in packages/*.yml; do
                [[ "${f#packages/}" =~ ^${name_re}\.yml$ ]] || continue
                take "$f" "$f" "$results_max"
              done
            fi
          fi
          if dir_ok "$STATUSES"; then
            for name in "$PACKAGE" _upstream; do
              take "$STATUSES/$name" ".status/$name" "$results_max"
            done
            # These records hold a line for each package, and PKGBUILD code of this one reads them
            for name in _arches _assets _alerts; do
              [[ -f "$STATUSES/$name" && ! -L "$STATUSES/$name" ]] || continue
              install -d "$WORK/.status"
              awk -F'\t' -v p="$PACKAGE" '$1 "" == p ""' "$STATUSES/$name" >"$WORK/.status/$name"
              chmod 0644 "$WORK/.status/$name"
            done
          fi
        else
          take README.md README.md "$results_max"
          if [[ -d packages && ! -L packages ]]; then
            for f in packages/*.yml; do
              [[ "${f#packages/}" =~ ^${name_re}\.yml$ ]] || continue
              # Links become links to themselves, which check-all.sh fails without reading anything
              if [[ -L "$f" ]]; then
                install -d "$WORK/packages"
                ln -s "${f#packages/}" "$WORK/$f"
              else
                take "$f" "$f" "$results_max"
              fi
            done
          fi
          if dir_ok "$STATUSES"; then
            for f in "$STATUSES"/*; do
              # The records of the run, such as _upstream, start with _
              [[ "${f##*/}" =~ ^(${name_re}|_[a-z]+)$ ]] || continue
              take "$f" ".status/${f##*/}" "$results_max"
            done
          fi
          if dir_ok "$HANDOFF"; then
            (cd "$HANDOFF" && find prepared status rules -type f -print0 2>/dev/null || true) |
              while IFS= read -r -d '' f; do
                # status/_unverified lists the packages that verify did not reach
                if [[ "$f" =~ ^prepared/${name_re}/(PKGBUILD|\.SRCINFO|base)$ ]] ||
                  [[ "$f" =~ ^(status/(${name_re}|_unverified)|rules/${name_re})$ ]]; then
                  take "$HANDOFF/$f" "handoff/$f" "$(handoff_max "$f")"
                fi
              done
          fi
          # Each answer is named by the SHA-256 of its URL
          if dir_ok "$GITLAB_ANSWERS"; then
            for f in "$GITLAB_ANSWERS"/*; do
              [[ "${f##*/}" =~ ^[0-9a-f]{64}$ ]] || continue
              take "$f" ".gitlab/${f##*/}" "$results_max"
            done
          fi
        fi
        chown -R builder:builder "$WORK"

        read -ra check_args <<<"$ARGS"
        keep="GITHUB_REPOSITORY${KEEP_ENV:+,$KEEP_ENV}"
        # Commits can add .gitlab/ to the repository, so the scripts read answers from the directory this names
        if [[ -n "$GITLAB_ANSWERS" ]]; then
          export AURTOMATOR_GITLAB_ANSWERS="$WORK/.gitlab"
          keep+=,AURTOMATOR_GITLAB_ANSWERS
        fi
        # The runner ignores workflow commands until it reads the token, which builder never sees.
        # cat ends when no process of builder holds the pipe, so the token comes last.
        token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        echo "::stop-commands::$token"
        rc=0
        (cd "$WORK" && sudo "--preserve-env=$keep" -u builder "$code/scripts/check-all.sh" "${check_args[@]}") 2>&1 | cat || rc=$?
        readme_rc=0
        if [[ "$rc" -eq 0 && "$README_TOO" == true ]]; then
          # update-readme.sh reads GITHUB_REPOSITORY alone, so it gets no token of keep-env
          (cd "$WORK" && sudo --preserve-env=GITHUB_REPOSITORY -u builder "$code/scripts/update-readme.sh") 2>&1 | cat || readme_rc=$?
        fi
        echo "::$token::"
        # update-readme.sh ends with 3 when it leaves README.md as it is, and the run goes on
        if [[ "$readme_rc" -eq 3 ]]; then
          echo "::warning::README.md stays as it is, the log of this step names the reason"
        elif [[ "$readme_rc" -ne 0 ]]; then
          rc=$readme_rc
        fi
        exit "$rc"
